name: Recreate Flutter Project & Push

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write    # Grants permission to commit and push changes back to the repo

jobs:
  recreate-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean Old Files and Generate New Flutter Project
        run: |
          # 1. Clean out existing files (except .git and .github directory)
          echo "Removing old files..."
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # 2. Get current repository name to use as a valid Flutter project name
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # Format name: lowercase and replace non-alphanumeric chars with underscores
          PROJECT_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_]+/_/g' | sed -E 's/^_+|_+$//g')

          # If the resulting name is empty or starts with a number, fall back to a safe default
          if [[ -z "$PROJECT_NAME" || "$PROJECT_NAME" =~ ^[0-9] ]]; then
            PROJECT_NAME="flutter_app"
          fi

          echo "Generating new project: $PROJECT_NAME"

          # 3. Create fresh Flutter project directly in the repository root
          flutter create --project-name "$PROJECT_NAME" --org com.example .

      - name: Commit and Push Clean Project
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          
          # Check if there are changes before committing
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: recreate clean Flutter project and remove legacy files"
            git push origin HEAD:${{ github.ref_name }}
          fi
          
