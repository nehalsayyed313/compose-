name: Manual Build APK

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Git repository URL to clone'
        required: true
        default: 'https://github.com/xuhcc/beancount-mobile.git'
      repo_branch:
        description: 'Branch, Tag, or Commit SHA'
        required: true
        default: 'master'

env:
  SKIP_JDK_VERSION_CHECK: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo_url == 'https://github.com/xuhcc/beancount-mobile.git' && 'xuhcc/beancount-mobile' || '' }}
          ref: ${{ github.event.inputs.repo_branch }}

      - name: Clone via URL (Fallback)
        if: github.event.inputs.repo_url != 'https://github.com/xuhcc/beancount-mobile.git'
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.repo_branch }} ${{ github.event.inputs.repo_url }} .

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Node.js 14.x
        uses: actions/setup-node@v4
        with:
          node-version: 14

      - name: Install NativeScript CLI (v7.x)
        run: |
          npm install -g nativescript@7.2.1 --ignore-scripts

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Android Debug APK
        run: |
          ns build android --env.uglify

      - name: Locate and Stage APK
        run: |
          mkdir -p output
          find platforms/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/ \; || find . -name "*.apk" -exec cp {} output/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beancount-mobile-apk
          path: output/*.apk
          retention-days: 7
          
