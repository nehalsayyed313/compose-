name: Build Ultra-Minimal Flutter arm64 APK

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Fresh Flutter Project
        run: |
          flutter create --org com.minimal --platforms android minimal_app
          cd minimal_app

      - name: Configure Aggressive R8 / ProGuard and ABI Split
        working-directory: minimal_app
        run: |
          # 1. Update android/app/build.gradle for R8 optimization & arm64 target
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.minimal.minimal_app"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.minimal.minimal_app"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName

                  ndk {
                      abiFilters "arm64-v8a"
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              packaging {
                  resources {
                      excludes += [
                          'META-INF/*.version',
                          'META-INF/DEPENDENCIES',
                          'META-INF/LICENSE*',
                          'META-INF/NOTICE*',
                          'DebugProbesKt.bin'
                      ]
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          # 2. Add minimal ProGuard rules
          cat << 'EOF' > android/app/proguard-rules.pro
          -dontwarn io.flutter.**
          -keep class io.flutter.** { *; }
          -dontwarn androidx.**
          -assumenosideeffects class android.util.Log {
              public static boolean isLoggable(java.lang.String, int);
              public static int v(...);
              public static int d(...);
              public static int i(...);
              public static int w(...);
          }
          EOF

      - name: Build Ultra-Minimal arm64 APK
        working-directory: minimal_app
        run: |
          mkdir -p build/symbols
          
          # Target arm64, obfuscate Dart code, strip debug info & tree-shake unused icons
          flutter build apk --release \
            --target-platform=android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols \
            --tree-shake-icons

      - name: Inspect and Print Output Size
        working-directory: minimal_app
        run: |
          echo "=== APK DETAILS ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload arm64 Minimal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimal-flutter-arm64-release
          path: minimal_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
