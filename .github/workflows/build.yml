name: Manual Build APK

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Git repository URL to clone'
        required: true
        default: 'https://github.com/xuhcc/beancount-mobile.git'
      repo_branch:
        description: 'Branch, Tag, or Commit SHA'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo_url == 'https://github.com/xuhcc/beancount-mobile.git' && 'xuhcc/beancount-mobile' || '' }}
          ref: ${{ github.event.inputs.repo_branch }}

      # Custom clone step if a custom repository URL is supplied
      - name: Clone via URL (Fallback for external forks)
        if: github.event.inputs.repo_url != 'https://github.com/xuhcc/beancount-mobile.git'
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.repo_branch }} ${{ github.event.inputs.repo_url }} .

      - name: Set up Java 11 (JDK for NativeScript 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Node.js 14.x
        uses: actions/setup-node@v4
        with:
          node-version: 14

      - name: Install NativeScript CLI (v7.x)
        run: |
          npm install -g nativescript@7.2.1 --ignore-scripts

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Android Debug APK
        run: |
          ns build android --env.uglify
        # Alternatively, if you want release APK without signing:
        # ns build android --release --copy-to ./app-debug.apk

      - name: Locate and Stage APK
        run: |
          mkdir -p output
          # Find generated apk files and copy them to the output folder
          find platforms/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/ \; || find . -name "*.apk" -exec cp {} output/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beancount-mobile-apk
          path: output/*.apk
          retention-days: 7
          
