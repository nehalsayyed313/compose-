name: runner

on:
  workflow_dispatch:

jobs:
  running:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rust Nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
    

      - name: running 
        run: |
              git clone --depth 1 https://codeberg.org/IBlameYou/lumi.git
              cd lumi
              cargo build --release
              cargo --version
              rustc --version
