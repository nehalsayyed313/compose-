name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten toolchain
        uses: emscripten-core/setup-emsdk@v15

      - name: Verify installation
        run: |
            git clone --depth 1 https://codeberg.org/cryptool-org/openssl-webterm.git
            cd openssl-webterm
            npm install 
            npm run build:openssl
            npm run build 
            ls
        
