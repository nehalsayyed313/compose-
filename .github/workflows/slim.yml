name: Scaffold App and Reset Repo

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Application Name"
        required: false
        default: "MyApplication"
      package_name:
        description: "Package Name"
        required: false
        default: "com.example.myapplication"

permissions:
  contents: write

jobs:
  create-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android CLI and generate project
        run: |
          # 1. Install Android CLI
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          
          # Add default installer target directories to PATH
          export PATH="$HOME/.android/bin:$HOME/.local/bin:$HOME/bin:$PATH"

          # 2. Generate project into an isolated folder
          mkdir -p temp_app
          cd temp_app

          # Run the project generator command (update arguments if targeting a specific template)
          android create project \
            --name "${{ inputs.project_name }}" \
            --package "${{ inputs.package_name }}" || true

          cd ..

      - name: Wipe old files and copy new project
        run: |
          # Remove all tracked/untracked root files except .git, .github, and temp_app
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'temp_app' -exec rm -rf {} +

          # Move generated files to root
          cp -rf temp_app/. .
          rm -rf temp_app

      - name: Commit and push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
          else
            git commit -m "feat: initialize new project via android-cli"
            git push
          fi
          
