name: Create and Push MAUI Project

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Name of the MAUI project"
        required: false
        default: "MyMauiApp"
        type: string

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wipe existing repository contents
        run: |
          # Remove everything in root except .git and .github
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Templates
        run: |
          dotnet new install Microsoft.Maui.Templates

      - name: Create MAUI Project at root
        run: |
          dotnet new maui -n "${{ inputs.project_name }}" -o . --force

      - name: Commit and push clean state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wipe old files and initialize MAUI: ${{ inputs.project_name }}" || exit 0
          git push origin HEAD
          
