name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/abitofhelp/dev-container-ada:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Town
        run: |
          git clone --depth 1 https://codeberg.org/ZenitDS/town.git
          cd town
          alr -n build
          
