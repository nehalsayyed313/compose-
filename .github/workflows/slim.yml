name: Build Lagrange

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
           python-version: '3.12'

      - name: Install build dependencies and test
        run: |
          git clone --depth 1 https://codeberg.org/slidge/slidge.git
          cd slidge
          pip install .
