name: runner

on:
  workflow_dispatch:

jobs:
  running:
    runs-on: ubuntu-latest
    steps:
      

      - name: running 
        run: |
             git clone --recursive https://codeberg.org/jlmakiola/calendula.git
             cd calendula 
             chmod +x gradlew
             ./gradlew assembleDebug --no-daemon 
          
