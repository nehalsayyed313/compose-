name: runner

on:
  workflow_dispatch:

jobs:
  running:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
           distribution: 'temurin' # Options include: temurin, zulu, adopt, microsoft, corretto, etc.
           java-version: '17'

      - name: running 
        run: |
              git clone --depth 1 https://codeberg.org/IBlameYou/lumi.git
              cd lumi
              cargo build --release
