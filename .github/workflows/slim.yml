name: Scaffold App and Reset Repo

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Application Name"
        required: false
        default: "MyApplication"
      application_id:
        description: "Application ID / Package Name"
        required: false
        default: "com.example.myapplication"

permissions:
  contents: write

jobs:
  create-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android CLI
        run: |
          # Download and install Google Android CLI
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          
          # Locate installed binary and expose to all subsequent steps
          CLI_DIR=$(dirname "$(find "$HOME" -name "android" -type f -executable 2>/dev/null | head -n 1)")
          if [ -z "$CLI_DIR" ]; then
            echo "Error: Android CLI binary not found after installation."
            exit 1
          fi
          echo "$CLI_DIR" >> "$GITHUB_PATH"
          echo "Android CLI installed at: $CLI_DIR"

      - name: Scaffold project and verify output
        run: |
          # Scaffold using official android create syntax
          android create \
            --name="${{ inputs.project_name }}" \
            --application-id="${{ inputs.application_id }}" \
            --namespace="${{ inputs.application_id }}" \
            --output="./temp_app"

          # Verify files were generated before doing any cleanup
          if [ ! -d "temp_app" ] || [ -z "$(ls -A temp_app)" ]; then
            echo "Error: temp_app is empty. Project generation failed."
            exit 1
          fi

      - name: Wipe old files and swap new project
        run: |
          # 1. Remove all old repository files except .git, .github, and temp_app
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'temp_app' -exec rm -rf {} +

          # 2. Prevent workflow push permission errors if template created any workflows
          rm -rf temp_app/.github/workflows

          # 3. Move new project files into root
          cp -rf temp_app/. .
          rm -rf temp_app

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff-index --quiet HEAD; then
            echo "No changes detected to commit."
          else
            git commit -m "feat: scaffold new Android app"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          
