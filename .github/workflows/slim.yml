name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify installation
        run: |
            git clone --depth 1 https://codeberg.org/marvin1099/Clock.git
            cd Clock
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon 
        
