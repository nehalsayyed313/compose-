name: Build errm-SQLite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc libsqlite3-dev sqlite3

      - name: Set up Just command runner
        uses: extractions/setup-just@v2

      - name: Set up Erlang/OTP 28 and Rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'latest'

      - name: Manually Clone Repository
        run: |
          git clone --depth 1 https://codeberg.org/h4rl/errm-SQLite.git app-source

      - name: Build Application
        working-directory: app-source
        run: |
          rebar3 compile
