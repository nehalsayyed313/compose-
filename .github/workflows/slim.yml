name: Create and Push MAUI Project

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Name of the MAUI project"
        required: false
        default: "MyMauiApp"
        type: string

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Templates
        run: |
          dotnet new install Microsoft.Maui.Templates

      - name: Create MAUI Project
        run: |
          dotnet new maui -n "${{ inputs.project_name }}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Scaffold MAUI project: ${{ inputs.project_name }}" || exit 0
          git push origin HEAD
          
