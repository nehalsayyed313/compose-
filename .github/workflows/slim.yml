name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      

      - name: Clone repository
        run: |
          sudo apt update -y
          sudo apt install \
          build-essential \
          cmake \
          git \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libfreetype-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxi-dev \
          libudev-dev \
          libflac-dev \
          libvorbis-dev -y
  
          git clone --depth 1 https://github.com/SFML/SFML.git
          cd SFML
          mkdir build 
          cd build 
          cmake ..
          make install -j 4
      
