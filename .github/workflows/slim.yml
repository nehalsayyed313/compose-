name: CI Eco Action

on:
  workflow_dispatch:

jobs:
  eco-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Eco Action
        run: |
          chmod +x ./github_EPYC_7763_4_CPU_shared.sh
          ./github_EPYC_7763_4_CPU_shared.sh
        env:
          CO2_GRID_INTENSITY: 472
          
