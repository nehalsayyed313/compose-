name: runner

on:
  workflow_dispatch:

jobs:
  running:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rust Nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        
    

      - name: running 
        run: |
              git clone --depth 1 https://codeberg.org/0thElement/kldnimbus.git
              cd kldnimbus
              cargo build --release
              cargo --version
              rustc --version
