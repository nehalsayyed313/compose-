name: Build Lagrange

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Haskell (Stack)
        uses: haskell-actions/setup@v2
        with:
          stack-version: 'latest'
          enable-stack: true

      - name: Install build dependencies and test
        run: |
          git clone --depth 1 https://github.com/mfussenegger/mkjson.git
          cd mkjson
          stack install
