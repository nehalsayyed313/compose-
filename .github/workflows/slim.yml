name: runner

on:
  workflow_dispatch:

jobs:
  running:
    runs-on: ubuntu-latest
    steps:
      

      - name: running 
        run: |
             git clone --recursive https://codeberg.org/jlmakiola/calendula.git
             cd calendula 
             chmod +x gradlew
             ./gradlew assembleDebug --no-daemon 
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-name
          path: calendula/app/build/outputs 
    
