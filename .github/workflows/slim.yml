name: Build Lagrange

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          git clone --depth 1 https://codeberg.org/zigtoberfest/website.git
          cd website
          curl https://mise.run | sh
          mise trust && mise install   # install Node.js and pnpm
          pnpm install
          npm run build
