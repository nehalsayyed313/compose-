name: Reset & Create Godot Project

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Name of the new Godot project"
        required: true
        default: "NewGodotProject"
        type: string

permissions:
  contents: write

jobs:
  create-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Clean repository
        run: |
          # Delete all files and folders except .git and .github (to preserve this workflow)
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +

      - name: Generate new Godot project
        run: |
          # 1. Create a minimal Godot 4 project file
          cat <<EOF > project.godot
          ; Engine configuration file.
          config_version=5

          [application]

          config/name="${{ inputs.project_name }}"
          config/features=PackedStringArray("4.3", "Forward Plus")
          EOF

          # 2. Add standard Godot gitignore
          cat <<EOF > .gitignore
          .godot/
          *.translation
          EOF

          # 3. Initialize project structure via headless Godot
          godot --headless --path . --editor --quit || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          # Only commit and push if there are tracked file changes
          if ! git diff --staged --quiet; then
            git commit -m "Initialize Godot project: ${{ inputs.project_name }} (clean reset)"
            git push origin HEAD:${{ github.ref }}
          fi
          
