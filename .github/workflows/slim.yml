# .github/workflows/build.yml
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      

      - name: Install required system packages
        run: |
          git clone --depth 1 https://codeberg.org/sbute/restaurant.git
          cd restaurant
          npm install -g pnpm
          pnpm install 
          npm run build
