name: runner

on:
  workflow_dispatch:

jobs:
  running:
    runs-on: ubuntu-latest
    steps:
      
      - name: setup ocaml   
        uses: ocaml/setup-ocaml@v3

      - name: running 
        run: |
              git clone --depth 1 https://codeberg.org/eris/kapla.git
              cd kapla
              make -j 4

              
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-name
          path: Countr/app/build/outputs
    
