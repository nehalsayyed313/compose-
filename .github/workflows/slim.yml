name: runner

on:
  workflow_dispatch:

jobs:
  running:
    runs-on: ubuntu-latest
    steps:
      
      

      - name: running 
        run: |
              git clone --depth 1 https://codeberg.org/mattclarke/filewriter.git
              cd filewriter
              cargo build --release

              
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-name
          path: filewriter/target
    
