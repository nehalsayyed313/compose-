name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      

      - name: Clone repository
        run: |
          git clone --depth 1 https://github.com/SFML/SFML.git
          cd SFML
          mkdir build 
          cd build 
          cmake ..
          make install -j 4
      
