name: learn and test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
           dotnet-version: '11.0.x' 
        
      - name: Install build dependencies and test
        run: |
          git clone --depth 1 https://codeberg.org/Lighty/Kit.git
          cd Kit
          dotnet publish -c Release -r linux-arm64 --self-contained true
          ls
