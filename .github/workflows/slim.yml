name: runner

on:
  workflow_dispatch:

jobs:
  running:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.10909125" >> $GITHUB_ENV

      - name: Clone Target Repository
        run: |
          git clone --depth 1 --recurse-submodules https://codeberg.org/universish/ZeeArchiver-Android-Mirror.git app-source

      - name: Build Application
        working-directory: app-source
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeeArchiver-debug-apk
          path: app-source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
