name: learn and test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install ARM64 Toolchain and LLVM Linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Clone and publish
        run: |
          git clone --depth 1 https://codeberg.org/Lighty/Kit.git
          cd Kit
          dotnet publish Kit/Kit.csproj \
            -c Release \
            -r linux-arm64 \
            --self-contained true \
            -p:LinkerFlavor=lld \
            -p:ObjCopyName=aarch64-linux-gnu-objcopy \
            -o publish
          ls -la publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kit-linux-arm64
          path: Kit/publish/
          if-no-files-found: error
          
