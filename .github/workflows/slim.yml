name: Build Lagrange

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      
      - name: Install build dependencies
        run: |
          git clone --depth 1 https://codeberg.org/tjammer/schmu.git
          cd schmu
          opam install . --deps-only --with-test
          opam exec -- dune build
          opam exec -- dune runtest
