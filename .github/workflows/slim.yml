name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      

      - name: Clone repository
        run: |
          sudo apt update -y
          sudo apt-get install libsfml-dev libudev-dev pkg-config -y
          git clone --depth 1 https://github.com/johnBuffer/VerletSFML-Multithread.git
          cd VerletSFML-Multithread
          mkdir build 
          cd build 
          cmake ..
          make install -j 4
      
