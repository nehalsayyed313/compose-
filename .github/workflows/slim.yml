name: runner 

on: workflow_dispatch

jobs:
  running:
    runs-on: ubuntu-latest
    steps:
      
      - run: |
            git clone --depth 1 https://codeberg.org/universish/ZeeArchiver-Android-Mirror.git
            cd ZeeArchiver-Android-Mirror
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon 
