name: Build Qt 6 Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure Android NDK
        run: |
          # Use the pre-installed Android NDK from the GitHub runner
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n 1)
          echo "Selected NDK: $NDK_PATH"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Install Qt 6 for Android
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtquickcontrols2'
          cache: true

      - name: Configure CMake
        run: |
          ${{ env.Qt6_DIR }}/bin/qt-cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_ABIS="arm64-v8a" \
            -DANDROID_NDK_ROOT="${{ env.ANDROID_NDK_ROOT }}" \
            -DANDROID_SDK_ROOT="${{ env.ANDROID_SDK_ROOT }}"

      - name: Compile and Package APK
        run: |
          cmake --build build --target all
          cmake --build build --target apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qt-mobile-arm64-apk
          path: build/**/*.apk
          if-no-files-found: error
          
