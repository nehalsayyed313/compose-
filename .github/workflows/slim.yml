name: runner

on:
  workflow_dispatch:

jobs:
  running:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # Options include: temurin, zulu, adopt, microsoft, corretto, etc.
          java-version: '17'
    

      - name: running 
        run: |
              git clone --depth 1 https://codeberg.org/thea_mp5/Countr.git
              cd Countr
              chmod +x gradlew
              ./gradlew assembleDebug --no-daemon 

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-name
          path: Countr/app/build/outputs
    
