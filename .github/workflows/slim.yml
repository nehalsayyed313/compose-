name: runner

on:
  workflow_dispatch:

jobs:
  running:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
           distribution: 'temurin' # Options include: temurin, zulu, adopt, microsoft, corretto, etc.
           java-version: '25'

      - name: running 
        run: |
             git clone --depth 1 --recursive https://codeberg.org/xolatgames/Dima-Defense.git
             cd Dima-Defense 
             chmod +x gradlew
             ./gradlew assembleDebug --no-daemon 
    
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-name
          path: Dima-Defense/app/build/outputs 
    
