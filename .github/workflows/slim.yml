# .github/workflows/build.yml
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Initialize Eco CI Energy Estimation
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement

      - name: Install required system packages
        run: |
          git clone --depth 1 https://codeberg.org/KlikBit/rcmanager-frontend.git
          cd rcmanager-frontend
          npm install 
          npm run build

      
