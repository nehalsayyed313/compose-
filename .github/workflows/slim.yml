name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Town
        run: |
          git clone --depth 1 https://github.com/hadiyarajesh/compose-template.git
          cd compose-template
          chmod +x gradlew 
          ./gradlew assembleDebug --no-daemon 
          
          
