name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
        
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Build Caddy
        run: |
          git clone --depth 1 --recursive https://github.com/wie-project/kakehashi.git
          cd kakehashi
          cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: kakehashi
          path: kakehashi/target/release 
          
