name: Fastfetch Windows ARM64

on:
  workflow_dispatch:

jobs:
  run-fastfetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download and Run Fastfetch Native ARM64
        
        run: |
             git clone https://github.com/jigarius/docker-rails-example.git
             cd docker-rails-example
             docker-compose build
