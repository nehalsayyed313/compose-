name: Build Arti ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Arti in Termux Docker
        run: |
          # Eliminate host-container UID permission conflicts on workspace
          chmod -R 777 "${{ github.workspace }}"

          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/workspace" \
            termux/termux-docker:aarch64 \
            sh -c "
              set -e

              # 1. Update package database
              pkg update -y

              # 2. Install Rust, C/C++ build tools, pkg-config, and OpenSSL headers
              pkg install -y rust git clang make pkg-config openssl binutils

              # 3. Explicitly point Cargo and build.rs to Termux's OpenSSL and Clang toolchain
              export CC=clang
              export CXX=clang++
              export AR=llvm-ar
              export PKG_CONFIG_PATH=/data/data/com.termux/files/usr/lib/pkgconfig
              export OPENSSL_DIR=/data/data/com.termux/files/usr
              export OPENSSL_INCLUDE_DIR=/data/data/com.termux/files/usr/include
              export OPENSSL_LIB_DIR=/data/data/com.termux/files/usr/lib

              # 4. Clone and build in native Termux internal storage to bypass mount write locks
              cd /data/data/com.termux/files/home
              git clone --recursive https://github.com/zydou/arti.git
              cd arti

              # 5. Compile release binary
              cargo build -p arti --locked --release

              # 6. Export binary back to GitHub runner workspace
              cp target/release/arti /workspace/
            "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arti-termux-arm64
          path: arti
          
