name: learn

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      
      - name: running 
        run: |
             npm install -g @snap/valdi
             valdi dev_setup
             valdi doctor
             valdi --version
             mkdir my_valdi_app
             cd my_valdi_app
             valdi bootstrap
             valdi install android
             valdi build android 

