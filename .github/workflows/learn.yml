name: Build win-arm64 3D App

on:
  
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run CI in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1" # Supports versions 10.4 through 15.1
          usesh: true     # Runs commands inside the VM shell
          prepare: |
            pkg install -y gmake gcc
          run: |
            gmake test
