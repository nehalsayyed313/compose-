name: Build 

on:
  workflow_dispatch:


jobs:
  build:
    name: Build 
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gophish repository
        uses: actions/checkout@v4

      - name: setopam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1" # Change to your preferred OCaml version
          opam-pin: true        # Automatically pins local package definitions (.opam files)
          cache: true
        

      - name: Compile Gophish inside Alpine ARM64 Container
        run: |
            opam exec -- dune init proj my_project
            cd my_project
            opam build
