name: Build Gophish (Alpine ARM64)

on:
  workflow_dispatch:
    inputs:
      gophish_ref:
        description: "Gophish Git Branch or Tag (e.g., v0.12.1, master)"
        required: false
        default: "v0.12.1"
        type: string
      go_version:
        description: "Go Alpine Docker image tag"
        required: false
        default: "1.22"
        type: string

jobs:
  build:
    name: Build for Alpine ARM64
    # Runs natively on GitHub-hosted 64-bit ARM runners (no QEMU emulation)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Gophish repository
        uses: actions/checkout@v4
        with:
          repository: gophish/gophish
          ref: ${{ inputs.gophish_ref }}

      - name: Compile Gophish inside Alpine ARM64 Container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            golang:${{ inputs.go_version }}-alpine \
            sh -eux -c "
              apk add --no-cache gcc musl-dev git
              git config --global --add safe.directory /workspace
              
              export CGO_ENABLED=1
              export GOOS=linux
              export GOARCH=arm64
              export CGO_CFLAGS='-D_LARGEFILE64_SOURCE -D_GNU_SOURCE'
              
              go build -v \
                -buildvcs=false \
                -ldflags '-s -w -extldflags \"-static\"' \
                -o gophish
              
              chmod +x gophish
            "

      - name: Verify Binary Architecture & Linkage
        run: |
          file gophish

      - name: Package Release Bundle
        run: |
          mkdir -p dist
          tar -czvf dist/gophish-alpine-arm64.tar.gz \
            gophish \
            config.json \
            templates \
            static \
            db

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gophish-alpine-arm64
          path: dist/gophish-alpine-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
          
