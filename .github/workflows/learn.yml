name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      

      - name: Initialize and build Dune project
        run: |
             git clone --depth 1 --recursive https://codeberg.org/chrislanejones/rust-wasm-photo-tool.git
             cd rust-wasm-photo-tool
             cargo install wasm-pack --version 0.15.0 --locked
             npm i -g pnpm
             pnpm install 
             pnpm run build:wasm
