name: Enterprise Build Arti ARM64 (Android NDK)

on:
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      
      - name: running 
        run: |
             winget install -e --id Fastfetch-cli.Fastfetch --accept-source-agreements --accept-package-agreements --silent
             fastfetch
