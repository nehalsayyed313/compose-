name: Build win-arm64 Application

on:
  
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup MSVC for ARM64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Compile Standalone Win32 App
        run: |
          cl.exe /O2 /Fe:WineArm64Demo.exe main.c user32.lib /link /SUBSYSTEM:WINDOWS

      - name: Upload win-arm64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: WineArm64Demo
          path: WineArm64Demo.exe
          retention-days: 7
          
