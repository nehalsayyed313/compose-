name: learn

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      CI: "true"

    steps:
      - name: running
        run: |
          npx ns create my-mobile-app --tsc --no-interactive
          cd my-mobile-app
          npx ns build android --release --copy-to ../app-release.apk
          
