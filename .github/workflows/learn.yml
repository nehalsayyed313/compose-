name: learn

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      CI: "true"

    steps:
      - name: running
        run: |
          sudo npm install -g @snap/valdi
          yes '' | valdi dev_setup || true
          valdi doctor || true
          valdi --version
          mkdir -p my_valdi_app
          cd my_valdi_app
          yes '' | valdi bootstrap || true
          valdi install android
          valdi build android
          
