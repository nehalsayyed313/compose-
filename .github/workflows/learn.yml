name: Build Arti ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Arti in Termux Docker
        run: |
          chmod -R 777 "${{ github.workspace }}"

          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/workspace" \
            termux/termux-docker:aarch64 \
            sh -c "
              set -e

              # 1. Update package lists
              pkg update -y

              # 2. Install Rust, C/C++ toolchain, OpenSSL, and native zstd
              pkg install -y rust git clang make pkg-config openssl binutils libzstd

              # 3. Fix 'Unversioned target triples are not supported' in Bionic sys/cdefs.h
              export CFLAGS=\"-D__ANDROID_API__=24 --target=aarch64-linux-android24\"
              export CXXFLAGS=\"-D__ANDROID_API__=24 --target=aarch64-linux-android24\"
              export TARGET_CFLAGS=\"-D__ANDROID_API__=24 --target=aarch64-linux-android24\"
              export TARGET_CXXFLAGS=\"-D__ANDROID_API__=24 --target=aarch64-linux-android24\"
              export CFLAGS_aarch64_linux_android=\"-D__ANDROID_API__=24 --target=aarch64-linux-android24\"
              export CXXFLAGS_aarch64_linux_android=\"-D__ANDROID_API__=24 --target=aarch64-linux-android24\"

              # 4. Use Termux's precompiled libzstd to skip building C sources
              export ZSTD_SYS_USE_PKG_CONFIG=1

              # 5. OpenSSL & Clang paths
              export CC=clang
              export CXX=clang++
              export AR=llvm-ar
              export PKG_CONFIG_PATH=/data/data/com.termux/files/usr/lib/pkgconfig
              export OPENSSL_DIR=/data/data/com.termux/files/usr
              export OPENSSL_INCLUDE_DIR=/data/data/com.termux/files/usr/include
              export OPENSSL_LIB_DIR=/data/data/com.termux/files/usr/lib

              # 6. Build in native storage
              cd /data/data/com.termux/files/home
              git clone --recursive https://github.com/zydou/arti.git
              cd arti

              cargo build -p arti --locked --release

              # 7. Deliver binary to GitHub workspace
              cp target/release/arti /workspace/
            "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arti-termux-arm64
          path: arti
          
