name: Build win-arm64 3D App

on:
  
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup MSVC for ARM64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Compile Win32 OpenGL Application
        run: |
          cl.exe /O2 /Fe:WineArm64GL.exe main.c user32.lib gdi32.lib opengl32.lib /link /SUBSYSTEM:WINDOWS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WineArm64GL
          path: WineArm64GL.exe
          retention-days: 7
          
