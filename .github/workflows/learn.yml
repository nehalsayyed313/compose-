name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and WebAssembly kernel
        run: |
             git clone --depth 1 --recursive https://codeberg.org/SebastianRzk/Looksyk.git
             cd Looksyk
             chmod +x build.sh
             ./build.sh
