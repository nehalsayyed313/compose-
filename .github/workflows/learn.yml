name: Build JupyterLite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools and WebAssembly kernel
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyterlite-core jupyterlite-pyodide-kernel jupyterlab

      - name: Build static WASM site
        run: |
          jupyter lite build --output-dir dist

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupyterlite-static-site
          path: dist
          
