name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenCut
        uses: actions/checkout@v4

  
      - name: Build APK
        run: |
             git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp.git
             cd stable-diffusion.cpp
             mkdir build
             cd build
             cmake ..
             make -j 4
