name: Build WASM with WebGPU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Verify Emscripten installation
        run: |
          emcc -v
          emcmake cmake --version

      - name: Compile stable-diffusion.cpp to WebAssembly
        run: |
          git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp.git
          cd stable-diffusion.cpp
          mkdir build && cd build

          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXECUTABLE_SUFFIX=".html" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_THREAD_LIBS_INIT="-pthread" \
            -DCMAKE_HAVE_LIBC_PTHREAD=1 \
            -DLIBWEBM_HAVE_CXX_FLAG=1 \
            -DSD_BUILD_EXAMPLES=ON \
            -DCMAKE_C_FLAGS="-pthread -msimd128" \
            -DCMAKE_CXX_FLAGS="-pthread -msimd128" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread -s USE_WEBGPU=1 -s ALLOW_MEMORY_GROWTH=1 -s MAXIMUM_MEMORY=4GB -s WASM_BIGINT=1 -s FORCE_FILESYSTEM=1 -s PTHREAD_POOL_SIZE=4 -s PROXY_TO_PTHREAD=1 -s EXPORTED_RUNTIME_METHODS=ccall,cwrap,FS"

          emmake make -j $(nproc)

      - name: Stage Web Artifacts
        run: |
          mkdir -p dist
          find stable-diffusion.cpp/build -type f \( -name "*.wasm" -o -name "*.js" -o -name "*.html" -o -name "*.data" \) -exec cp -v {} dist/ \;

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-diffusion-wasm
          path: dist/
          retention-days: 14
          
