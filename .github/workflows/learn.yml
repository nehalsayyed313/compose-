name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and WebAssembly kernel
        run: |
             git clone --depth 1 --recursive https://github.com/caddyserver/caddy.git
             cd caddy 
             go build -v
