name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repo and Build
        run: |
          git clone --depth 1 --recursive https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          cmake -GNinja -B build
          ninja -C build

