name: learn

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    

    steps:
      - name: running
        run: |
          git clone --depth 1 --recursive https://github.com/capstone-engine/capstone.git
          cd capstone
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCAPSTONE_BUILD_SHARED_LIBS=1 -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          cd build
          cpack -G DEB
