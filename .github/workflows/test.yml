name: Build Zephyr for QEMU ARM64

on:
  workflow_dispatch:
    inputs:
      app_path:
        description: 'Sample or application path to build'
        required: true
        default: 'samples/subsys/shell/shell_module'
        type: string
      board:
        description: 'Target Zephyr board'
        required: true
        default: 'qemu_cortex_a53'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZEPHYR_SDK_VERSION: '0.17.0'
      ZEPHYR_TOOLCHAIN_VARIANT: 'zephyr'

    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util \
            device-tree-compiler wget xz-utils python3-dev python3-pip \
            python3-setuptools python3-tk python3-wheel libsdl2-dev

      - name: Set up Python Virtual Environment & West
        run: |
          python3 -m venv ~/zephyr-venv
          source ~/zephyr-venv/bin/activate
          pip install --upgrade pip
          pip install west

      - name: Initialize Zephyr Workspace
        run: |
          source ~/zephyr-venv/bin/activate
          west init ~/zephyrproject
          cd ~/zephyrproject
          # Narrow update to core modules for speed
          west update -n
          west zephyr-export
          pip install -r ~/zephyrproject/zephyr/scripts/requirements.txt

      - name: Download & Set Up Zephyr AArch64 Toolchain
        run: |
          cd $HOME
          SDK_TAR="zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          wget --progress=dot:giga \
            https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/${SDK_TAR}
          tar -xf ${SDK_TAR}
          rm -f ${SDK_TAR}

          # Run setup: -t downloads ONLY aarch64 toolchain, -h adds hosttools, -c registers in CMake
          cd zephyr-sdk-${ZEPHYR_SDK_VERSION}
          ./setup.sh -t aarch64-zephyr-elf -h -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-${ZEPHYR_SDK_VERSION}" >> $GITHUB_ENV

      - name: Build Application
        run: |
          source ~/zephyr-venv/bin/activate
          cd ~/zephyrproject/zephyr
          west build -b ${{ inputs.board }} ${{ inputs.app_path }} -d build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zephyr-qemu-arm64-build
          path: |
            ~/zephyrproject/zephyr/build/zephyr/zephyr.elf
            ~/zephyrproject/zephyr/build/zephyr/zephyr.bin
          if-no-files-found: error
          retention-days: 7
          
