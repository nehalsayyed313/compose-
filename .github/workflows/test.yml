name: Build Skia ARM64 (Native Runner)

on:
  workflow_dispatch:

jobs:
  build-skia:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Skia
        uses: actions/checkout@v4
        with:
          repository: google/skia
          path: skia
          submodules: recursive
          fetch-depth: 1

      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            libfontconfig1-dev \
            curl \
            git

      - name: Install Bazelisk (ARM64 Binary)
        run: |
          sudo curl -fSsL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-arm64
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Build Skia (Native ARM64)
        working-directory: skia
        run: |
          # Build public Skia static library in release mode
          bazel build //:skia_public --compilation_mode=opt

      - name: Upload Skia Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skia-linux-arm64
          path: skia/bazel-bin/libskia_public.a
          if-no-files-found: warn
          
