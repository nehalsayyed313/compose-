name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.11
      options: --user root
    steps:
      - name: Build FCF
        run: |
          git clone --depth 1 https://github.com/chyyuu/os_kernel_lab.git
          cd os_kernel_lab
          make -j 1
          
