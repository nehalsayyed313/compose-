name: build

on:
  workflow_dispatch: 

jobs:
  fedora-test:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # Options include 'temurin', 'zulu', 'corretto', etc.
          java-version: '25'

      - name: running 
        run: java --version
        
