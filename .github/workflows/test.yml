name: Build

on: workflow_dispatch

jobs:
  build:
     runs-on: ubuntu-latest
     steps:
       - name: Set up Java
         uses: actions/setup-java@v6
         with:
            distribution: 'temurin'
            java-version: '25'
           
       - name: running
         run: |
             git clone --depth 1 https://github.com/Kotlin/kotlinx.serialization.git
             cd kotlinx.serialization
             chmod +x gradlew 
             ./gradlew build --no-daemon 
