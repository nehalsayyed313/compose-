name: Build and Package Android Docs Offline

on:
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone DevDocs Engine
        run: |
          git clone --depth 1 https://github.com/freeCodeCamp/devdocs.git devdocs
          cd devdocs
          bundle install
          npm install

      - name: Download Full Android & Kotlin Documentation Sets
        working-directory: devdocs
        run: |
          # Download Android (platform APIs, SDK classes, AndroidX/Jetpack) and Kotlin docs
          bundle exec thor docs:download android
          bundle exec thor docs:download kotlin

      - name: Package Docs for Static Offline Hosting
        working-directory: devdocs
        run: |
          # Compile the static frontend assets with pre-baked offline indices
          bundle exec thor assets:compile
          
          # Create standalone offline distribution directory
          mkdir -p ../android-docs-offline
          cp -r public/* ../android-docs-offline/
          
          # Copy unpacked docsets directly into offline assets directory
          mkdir -p ../android-docs-offline/docs
          cp -r assets/docs/android* ../android-docs-offline/docs/ || true
          cp -r assets/docs/kotlin* ../android-docs-offline/docs/ || true

      - name: Compress Static Output
        run: |
          tar -czf android-docs-offline.tar.gz -C android-docs-offline .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-docs-offline
          path: android-docs-offline.tar.gz
          retention-days: 7
          
