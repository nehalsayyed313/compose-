name: Build

on:
  workflow_dispatch:

jobs:
  network-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: running 
        run: |
             git clone --depth 1 --recursive https://github.com/ggml-org/llama.cpp.git
             cd llama.cpp
             mkdir build
             cd build
             cmake .. -G Ninja
             ninja
