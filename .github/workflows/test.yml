name: Build and Package Android Docs Offline

on:
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download, Extract, and Index Docsets
        run: |
          mkdir -p build-docs
          mkdir -p android-docs-offline
          cd build-docs

          python3 - << 'EOF'
          import subprocess
          import sqlite3
          import json
          import os
          import re
          import shutil

          MIRROR_REGIONS = ["sanfrancisco", "frankfurt", "tokyo", "london", "newyork"]

          def download_docset(name):
              archive_name = f"{name}.tgz"
              print(f"--- Fetching {name} Docset ---")
              
              # 1. Try resolving mirrors from official feed
              feed_url = f"https://kapeli.com/feeds/{name}.xml"
              urls = []
              
              feed_cmd = subprocess.run(
                  ["curl", "-sL", "-A", "Mozilla/5.0", feed_url],
                  capture_output=True,
                  text=True
              )
              
              if feed_cmd.returncode == 0 and "<url>" in feed_cmd.stdout:
                  extracted_urls = re.findall(r'<url>(https?://[^<]+)</url>', feed_cmd.stdout)
                  urls.extend(extracted_urls)

              # 2. Add fallback mirror URLs in case the feed is unavailable
              for region in MIRROR_REGIONS:
                  urls.append(f"http://{region}.kapeli.com/feeds/zzz/{name.lower()}/{name}.tgz")
                  urls.append(f"http://{region}.kapeli.com/feeds/{name}.tgz")

              # 3. Iterate through mirrors until full archive is downloaded
              success = False
              for url in urls:
                  print(f"Trying mirror: {url}")
                  res = subprocess.run([
                      "curl", "-f", "-L", "-A", "Mozilla/5.0",
                      "--connect-timeout", "10",
                      "--max-time", "180",
                      "-o", archive_name,
                      url
                  ])
                  
                  if res.returncode == 0 and os.path.exists(archive_name) and os.path.getsize(archive_name) > 1000000:
                      size_mb = os.path.getsize(archive_name) // (1024 * 1024)
                      print(f"Successfully downloaded {name} ({size_mb} MB). Extracting...")
                      subprocess.run(["tar", "-xzf", archive_name], check=True)
                      success = True
                      break
                  else:
                      print("Mirror failed or file incomplete, trying next candidate...")

              if not success:
                  raise RuntimeError(f"Could not download docset for {name} from any available mirror.")

          # Download and unpack
          download_docset("Android")
          download_docset("Kotlin")

          # Copy static files to distribution folder
          print("Arranging static files...")
          out_dir = "../android-docs-offline"

          # 1. Android docs
          android_docs_path = "Android.docset/Contents/Resources/Documents"
          for item in os.listdir(android_docs_path):
              src = os.path.join(android_docs_path, item)
              dst = os.path.join(out_dir, item)
              if os.path.isdir(src):
                  shutil.copytree(src, dst, dirs_exist_ok=True)
              else:
                  shutil.copy2(src, dst)

          # 2. Kotlin docs
          kotlin_out = os.path.join(out_dir, "kotlin")
          os.makedirs(kotlin_out, exist_ok=True)
          kotlin_docs_path = "Kotlin.docset/Contents/Resources/Documents"
          for item in os.listdir(kotlin_docs_path):
              src = os.path.join(kotlin_docs_path, item)
              dst = os.path.join(kotlin_out, item)
              if os.path.isdir(src):
                  shutil.copytree(src, dst, dirs_exist_ok=True)
              else:
                  shutil.copy2(src, dst)

          # 3. Build SQLite Search Index
          print("Building unified offline search index...")
          all_indices = []

          # Android classes and APIs
          android_db = 'Android.docset/Contents/Resources/docSet.dsidx'
          if os.path.exists(android_db):
              conn = sqlite3.connect(android_db)
              cur = conn.cursor()
              cur.execute("SELECT name, type, path FROM searchIndex WHERE type IN ('Class', 'Interface', 'Package', 'Method', 'Constructor', 'Field')")
              for row in cur.fetchall():
                  all_indices.append({"name": row[0], "type": f"Android {row[1]}", "path": row[2]})
              conn.close()

          # Kotlin language symbols
          kotlin_db = 'Kotlin.docset/Contents/Resources/docSet.dsidx'
          if os.path.exists(kotlin_db):
              conn = sqlite3.connect(kotlin_db)
              cur = conn.cursor()
              cur.execute("SELECT name, type, path FROM searchIndex WHERE type IN ('Class', 'Interface', 'Package', 'Function', 'Property')")
              for row in cur.fetchall():
                  all_indices.append({"name": row[0], "type": f"Kotlin {row[1]}", "path": f"kotlin/{row[2]}"})
              conn.close()

          with open(os.path.join(out_dir, 'search-index.json'), 'w') as f:
              json.dump(all_indices, f)

          print(f"Indexed {len(all_indices):,} total Android & Kotlin symbols.")

          # 4. Generate Responsive Offline Web UI
          html_template = """<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
            <title>Android & Kotlin Offline Docs</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden; }
              #sidebar { width: 360px; border-right: 1px solid #334155; display: flex; flex-direction: column; background: #1e293b; height: 100%; }
              #search-box { padding: 12px; border-bottom: 1px solid #334155; }
              #search { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
              #search:focus { border-color: #3b82f6; }
              #count { font-size: 11px; color: #94a3b8; margin-top: 6px; padding-left: 2px; }
              #results { flex: 1; overflow-y: auto; list-style: none; }
              .item { padding: 10px 14px; border-bottom: 1px solid #334155; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
              .item:hover, .item:active { background: #334155; }
              .name { font-size: 13px; font-weight: 600; color: #e2e8f0; word-break: break-word; }
              .type { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #0f172a; color: #38bdf8; font-weight: 600; margin-left: 8px; white-space: nowrap; }
              #main { flex: 1; display: flex; flex-direction: column; background: #ffffff; }
              iframe { flex: 1; border: none; width: 100%; height: 100%; }
              @media (max-width: 768px) {
                body { flex-direction: column; }
                #sidebar { width: 100%; height: 42vh; }
                #main { height: 58vh; }
              }
            </style>
          </head>
          <body>
            <div id="sidebar">
              <div id="search-box">
                <input type="text" id="search" placeholder="Search (e.g., Activity, Notification, View)..." autofocus>
                <div id="count">Loading offline symbols...</div>
              </div>
              <ul id="results"></ul>
            </div>
            <div id="main">
              <iframe id="viewer" src="reference/packages.html"></iframe>
            </div>

            <script>
              let data = [];
              const searchInput = document.getElementById('search');
              const resultsList = document.getElementById('results');
              const countEl = document.getElementById('count');
              const viewer = document.getElementById('viewer');

              fetch('search-index.json')
                .then(r => r.json())
                .then(json => {
                  data = json;
                  countEl.innerText = `${data.length.toLocaleString()} symbols ready offline`;
                  render(data.slice(0, 80));
                })
                .catch(() => {
                  countEl.innerText = 'Error loading index';
                });

              function render(items) {
                resultsList.innerHTML = items.map(it => `
                  <li class="item" onclick="loadDoc('${it.path}')">
                    <span class="name">${it.name}</span>
                    <span class="type">${it.type}</span>
                  </li>
                `).join('');
              }

              let timer;
              searchInput.addEventListener('input', (e) => {
                clearTimeout(timer);
                timer = setTimeout(() => {
                  const q = e.target.value.toLowerCase().trim();
                  if (!q) return render(data.slice(0, 80));
                  const matches = data.filter(d => d.name.toLowerCase().includes(q)).slice(0, 100);
                  render(matches);
                  countEl.innerText = `${matches.length} results`;
                }, 80);
              });

              function loadDoc(path) {
                viewer.src = path;
              }
            </script>
          </body>
          </html>"""

          with open(os.path.join(out_dir, 'index.html'), 'w') as f:
              f.write(html_template)
          EOF

      - name: Compress Static Output
        run: |
          tar -czf android-docs-offline.tar.gz -C android-docs-offline .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-docs-offline
          path: android-docs-offline.tar.gz
          retention-days: 7
          
