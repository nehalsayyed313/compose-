name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Options include: temurin, zulu, adopt, microsoft, corretto, etc.
          java-version: '17'      # Can be '8', '11', '17', '21', '25', etc.
    
          
      - name: Build
        run: |
           git clone --depth 1 https://github.com/android-studio-templates/EmptyActivity.git
           cd EmptyActivity
           chmod +x gradlew
           ./gradlew assembleDebug --no-daemon
