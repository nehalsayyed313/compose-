name: Build and Package Expo Docs

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Branch or tag to clone from expo/expo'
        required: true
        default: 'main'
        type: string

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: 'expo/expo'
          ref: ${{ inputs.sdk_version }}
          sparse-checkout: |
            docs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile=false --ignore-scripts

      - name: Patch Config and Build Docs
        working-directory: docs
        run: |
          # 1. Patch the explicit TypeScript type annotation error
          if [ -f "common/code-utilities.ts" ]; then
            sed -i 's/sdkVersionValues.find(s =>/sdkVersionValues.find((s: any) =>/g' common/code-utilities.ts
          fi

          # 2. Configure next.config to ignore any remaining TS/ESLint build checks
          node -e "
            const fs = require('fs');
            const file = fs.existsSync('next.config.js') ? 'next.config.js' : 'next.config.mjs';
            let content = fs.readFileSync(file, 'utf8');
            if (content.includes('typescript:')) {
              content = content.replace(/typescript:\s*{[^}]*}/, 'typescript: { ignoreBuildErrors: true }');
            } else {
              content = content.replace(/(module\.exports\s*=\s*{|export\s+default\s+{)/, '\$1\n  typescript: { ignoreBuildErrors: true },\n  eslint: { ignoreDuringBuilds: true },');
            }
            fs.writeFileSync(file, content);
          "

          # 3. Run static export with sufficient memory allocation
          NODE_OPTIONS="--max-old-space-size=8192" pnpm export

      - name: Compress Static Output
        working-directory: docs
        run: |
          tar -czf expo-docs-offline.tar.gz -C out .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-docs-offline
          path: docs/expo-docs-offline.tar.gz
          retention-days: 7
          
