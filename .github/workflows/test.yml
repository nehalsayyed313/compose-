name: build

on:
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4    

      
      - name: Running build
        run: |
             git clone --depth 1 https://codeberg.org/curl/curl-mirror.git
             cd curl-mirror
             docker build -t curl .
