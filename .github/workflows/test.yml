name: Android Emulator Canvas Drawing

on:
  workflow_dispatch:

jobs:
  draw-on-android:
    name: Build, Record & Capture Android Drawing
    runs-on: ubuntu-latest

    steps:
      - name: Download System Image & Boot Android Emulator
        run: |
          # Expose adb and unify the AVD directory across all steps
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"

          # Enable KVM hardware acceleration if exposed by the runner
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          PKG_PATH="system-images;android-34;default;x86_64"

          # Accept SDK licenses and fetch the lightweight AOSP x86_64 system image
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "$PKG_PATH"

          # Create the AVD
          echo "no" | "$AVDMANAGER" create avd \
            --force \
            --name test_avd \
            --package "$PKG_PATH"

          # Boot the emulator headless using pre-installed libs
          export LD_LIBRARY_PATH="$ANDROID_HOME/emulator/lib64:$ANDROID_HOME/emulator/lib64/qt/lib:$LD_LIBRARY_PATH"
          "$ANDROID_HOME/emulator/emulator" -avd test_avd \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect &

          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            sleep 2
          done
          adb shell input keyevent 82 || true

      - name: Write Android Canvas Drawing App
        run: |
          mkdir -p src/com/example/drawingapp

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.drawingapp"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <application
                  android:label="DrawingApp"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/com/example/drawingapp/MainActivity.java
          package com.example.drawingapp;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.os.Bundle;
          import android.view.View;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(new CanvasView(this));
              }

              static class CanvasView extends View {
                  private final Paint ringPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint starPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

                  public CanvasView(Context context) {
                      super(context);
                      ringPaint.setStyle(Paint.Style.STROKE);
                      starPaint.setStyle(Paint.Style.FILL);
                      starPaint.setColor(Color.YELLOW);
                      textPaint.setColor(Color.WHITE);
                      textPaint.setTextAlign(Paint.Align.CENTER);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      float density = getResources().getDisplayMetrics().density;
                      float cx = getWidth() / 2f;
                      float cy = getHeight() / 2f;

                      // Black background
                      canvas.drawColor(Color.BLACK);

                      // 1. Draw glowing concentric rings
                      ringPaint.setStrokeWidth(5f * density);
                      for (int i = 1; i <= 6; i++) {
                          float radius = i * 28f * density;
                          float hue = (i / 6f) * 360f;
                          ringPaint.setColor(Color.HSVToColor(new float[]{hue, 0.85f, 1.0f}));
                          canvas.drawCircle(cx, cy, radius, ringPaint);
                      }

                      // 2. Draw a 5-point star in the center
                      Path star = new Path();
                      int points = 5;
                      float outerRadius = 65f * density;
                      float innerRadius = 28f * density;

                      for (int i = 0; i < points * 2; i++) {
                          double angle = (i * Math.PI / points) - (Math.PI / 2.0);
                          float r = (i % 2 == 0) ? outerRadius : innerRadius;
                          float x = cx + (float) (Math.cos(angle) * r);
                          float y = cy + (float) (Math.sin(angle) * r);
                          if (i == 0) {
                              star.moveTo(x, y);
                          } else {
                              star.lineTo(x, y);
                          }
                      }
                      star.close();
                      canvas.drawPath(star, starPaint);

                      // 3. Bottom label
                      textPaint.setTextSize(18f * density);
                      canvas.drawText("Drawn with Android Canvas", cx, getHeight() - (50f * density), textPaint);
                  }
              }
          }
          EOF

      - name: Compile, Sign, Install & Record Video
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          ANDROID_JAR=$(ls "$ANDROID_HOME/platforms/"*/android.jar | sort -V | tail -n 1)

          # 1. Package AndroidManifest.xml into an empty APK
          "$BUILD_TOOLS/aapt2" link \
            --manifest AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            -o unsigned.apk

          # 2. Compile Java source and convert bytecode to DEX
          mkdir -p classes
          javac --release 11 -classpath "$ANDROID_JAR" -d classes src/com/example/drawingapp/MainActivity.java
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --output . classes/com/example/drawingapp/*.class

          # 3. Insert classes.dex, align, and sign with a generated debug key
          zip -j unsigned.apk classes.dex
          "$BUILD_TOOLS/zipalign" -f 4 unsigned.apk aligned.apk

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out DrawingApp.apk \
            aligned.apk

          # 4. Install, record screen, launch activity, and capture screenshot
          adb install DrawingApp.apk
          adb shell screenrecord /sdcard/android-drawing.mp4 &
          sleep 1

          adb shell am start -n com.example.drawingapp/.MainActivity
          sleep 5

          adb exec-out screencap -p > android-drawing.png

          # Send SIGINT so screenrecord cleanly writes the MP4 trailer
          adb shell pkill -INT screenrecord || true
          sleep 2
          adb pull /sdcard/android-drawing.mp4 android-drawing.mp4

      - name: Upload Drawing Video & Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: android-drawing-output
          path: |
            android-drawing.mp4
            android-drawing.png
          retention-days: 7
          
