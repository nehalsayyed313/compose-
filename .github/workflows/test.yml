name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build
        run: |
          git clone --depth 1 https://github.com/arya458/SideMenuJetPackCompose.git
          cd SideMenuJetPackCompose
          
          # Remove proxy configuration from gradle.properties if present
          if [ -f gradle.properties ]; then
            sed -i '/proxy/Id' gradle.properties
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: SideMenuJetPackCompose/app/build/outputs/apk
          
