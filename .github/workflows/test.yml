name: Build Cassia APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository manually
        run: |
          git clone --recurse-submodules https://github.com/cassia-org/cassiapp.git .

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '19'
          cache: 'gradle'

      - name: Install Ninja build tool
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Android NDK & SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            "build-tools;34.0.0"

      - name: Set execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build APK
        run: |
          case "${{ github.event.inputs.build_type }}" in
            release)
              ./gradlew assembleRelease --stacktrace
              ;;
            all)
              ./gradlew assembleDebug assembleRelease --stacktrace
              ;;
            *)
              ./gradlew assembleDebug --stacktrace
              ;;
          esac

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cassia-apks-${{ github.event.inputs.build_type }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
