name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Options include: temurin, zulu, adopt, microsoft, corretto, etc.
          java-version: '17'      # Can be '8', '11', '17', '21', '25', etc.
    
          
      - name: Build
        run: |
           git clone --depth 1 https://github.com/471D38UNNUX/Android-Assembly-Native-Activity.git
           cd Android-Assembly-Native-Activity
           gradle wrapper
           chmod +x gradlew
           ./gradlew assembleDebug --no-daemon
      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: Android-Assembly-Native-Activity/app/build/outputs/apk
    
