name: Build and Package Expo Docs

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Branch or tag to clone from expo/expo'
        required: true
        default: 'main'
        type: string

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: 'expo/expo'
          ref: ${{ inputs.sdk_version }}
          sparse-checkout: |
            docs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile=false --ignore-scripts

      - name: Patch Config and Build Docs
        working-directory: docs
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          # 1. Exclude scripts directory and disable strict checks in tsconfig.json
          node -e "
            const fs = require('fs');
            if (fs.existsSync('tsconfig.json')) {
              const tsconfig = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
              tsconfig.exclude = tsconfig.exclude || [];
              if (!tsconfig.exclude.includes('scripts')) tsconfig.exclude.push('scripts');
              if (!tsconfig.exclude.includes('scripts/**/*')) tsconfig.exclude.push('scripts/**/*');
              tsconfig.compilerOptions = tsconfig.compilerOptions || {};
              tsconfig.compilerOptions.noImplicitAny = false;
              tsconfig.compilerOptions.skipLibCheck = true;
              fs.writeFileSync('tsconfig.json', JSON.stringify(tsconfig, null, 2));
            }
          "

          # 2. Force next.config.js to ignore all TS and ESLint build errors
          node -e "
            const fs = require('fs');
            if (fs.existsSync('next.config.js')) {
              let src = fs.readFileSync('next.config.js', 'utf8');
              // Append override wrapper to the end of next.config.js
              src += '\n\nconst originalExport = module.exports;\nmodule.exports = async (...args) => {\n  const config = typeof originalExport === \"function\" ? await originalExport(...args) : originalExport;\n  return {\n    ...config,\n    typescript: { ...config?.typescript, ignoreBuildErrors: true },\n    eslint: { ...config?.eslint, ignoreDuringBuilds: true },\n  };\n};\n';
              fs.writeFileSync('next.config.js', src);
            }
          "

          # 3. Export static HTML
          pnpm export

      - name: Compress Static Output
        working-directory: docs
        run: |
          tar -czf expo-docs-offline.tar.gz -C out .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-docs-offline
          path: docs/expo-docs-offline.tar.gz
          retention-days: 7
          
