name: Android Emulator Xvfb Recording (3 Minutes)

on:
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest

    steps:
      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install System Dependencies (Xvfb, FFmpeg, Modern OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            ffmpeg \
            libpulse0 \
            libgl1 \
            libglx-mesa0 \
            libgl1-mesa-dri

      - name: Set Android SDK Environment Variables
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH" >> $GITHUB_ENV

      - name: Accept Licenses & Install Emulator System Image
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "system-images;android-34;google_apis;x86_64" "emulator" "platform-tools"

      - name: Create AVD (Android Virtual Device)
        run: |
          echo "no" | avdmanager create avd \
            -n test_emulator \
            -k "system-images;android-34;google_apis;x86_64" \
            --force \
            --device "pixel_6"

      - name: Run Emulator and Record Screen via Xvfb
        run: |
          # 1. Start Xvfb virtual display on screen :99
          Xvfb :99 -screen 0 1280x1024x24 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2

          # 2. Start screen recording with 3-minute hard limit (-t 180)
          echo "==> Starting 3-minute video recording..."
          ffmpeg -y \
            -video_size 1280x1024 \
            -framerate 30 \
            -f x11grab \
            -i :99.0 \
            -t 180 \
            -c:v libx264 \
            -preset ultrafast \
            -pix_fmt yuv420p \
            emulator_session.mp4 &
          FFMPEG_PID=$!

          # 3. Launch Android Emulator inside the Xvfb session
          echo "==> Starting Android Emulator..."
          emulator \
            -avd test_emulator \
            -accel on \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -camera-back none \
            -camera-front none &
          EMULATOR_PID=$!

          # 4. Wait for Android OS to complete booting
          echo "==> Waiting for ADB and boot completion..."
          adb wait-for-device
          
          BOOT_STATUS=""
          while [ "$BOOT_STATUS" != "1" ]; do
            BOOT_STATUS=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "Waiting for sys.boot_completed... (current: '$BOOT_STATUS')"
            sleep 2
          done
          echo "==> Emulator fully booted!"

          # 5. Run UI actions on the booted device
          adb shell input keyevent 82 # Unlock screen
          sleep 3
          adb shell am start -a android.intent.action.VIEW -d "https://www.google.com"

          # 6. Wait for the 3-minute recording to complete
          echo "==> Waiting for 3-minute recording duration to finish..."
          wait $FFMPEG_PID || true
          echo "==> Recording complete!"

          # Clean up background processes
          kill -9 $EMULATOR_PID || true
          kill -9 $XVFB_PID || true

      - name: Upload Video Recording Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-video
          path: emulator_session.mp4
          if-no-files-found: error
          
