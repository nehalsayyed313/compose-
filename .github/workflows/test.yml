name: build

on:
  workflow_dispatch: 

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Upgraded from '8' to support modern Gradle configuration

      - name: Running build
        run: | 
          git clone --depth 1 https://github.com/hvdwolf/jExifToolGUI.git
          cd jExifToolGUI
          ./gradlew build
          
