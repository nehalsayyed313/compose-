name: Benchmark Runner Network Speed

on:
  workflow_dispatch:

jobs:
  network-benchmark:
    # You can switch to larger runners (e.g. ubuntu-24.04-arm, or larger paid runners) to compare
    runs-on: ubuntu-24.04

    steps:
      - name: Install Benchmark Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            wget \
            aria2 \
            python3 \
            python3-pip

          # Official Ookla Speedtest binary
          curl -s https://packagecloud.io/install/repositories/ookla/speedtest-cli/script.deb.sh | sudo bash
          sudo apt-get install -y speedtest

          # Fast.com CLI (Go binary)
          wget -q https://github.com/ddo/fast/releases/latest/download/fast_linux_amd64 -O fast
          chmod +x fast
          sudo mv fast /usr/local/bin/

      - name: Run Ookla Multi-Stream Benchmark
        run: |
          echo "=================================================="
          echo "         OOKLA SPEEDTEST BENCHMARK                "
          echo "=================================================="
          # Accept Ookla EULA non-interactively and run verbose benchmark
          speedtest --accept-license --accept-gdpr -f human-readable

      - name: Run Fast.com (Netflix CDN) Benchmark
        run: |
          echo "=================================================="
          echo "         FAST.COM CDN THROUGHPUT                  "
          echo "=================================================="
          fast

      - name: Maximize Parallel Downlink (aria2c - 16 Connections)
        run: |
          echo "=================================================="
          echo "   PARALLEL TCP STREAM TEST (16 Connections)      "
          echo "=================================================="
          # Pulls a 1GB test file directly into /dev/null to measure pure network interface speed
          aria2c \
            -s 16 \
            -x 16 \
            -k 1M \
            --dir=/tmp \
            --out=speedtest_dump \
            --allow-overwrite=true \
            https://speed.cloudflare.com/__down?bytes=1073741824

          rm -f /tmp/speedtest_dump

      - name: Runner Network Interface Info
        run: |
          echo "=================================================="
          echo "        NETWORK ADAPTER LINK DETAILS              "
          echo "=================================================="
          ip -s link
          
