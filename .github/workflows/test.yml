name: Learn

on: workflow_dispatch

jobs:
  running:
     runs-on: ubuntu-latest
     steps:
       - name: Set up Python 3.12
         uses: actions/setup-python@v7
         with:
             python-version: '3.12'
       - name: runn     
         run: |
             git clone --depth 1 https://github.com/jmg049/PyWavers.git
             cd PyWavers
             pip install .
