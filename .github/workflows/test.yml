name: iOS Simulator Home Screen Screenshot

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'iOS Simulator Device Name'
        required: true
        default: 'iPhone 16 Pro'
        type: string

jobs:
  capture-homescreen:
    name: Capture iOS Home Screen
    runs-on: macos-latest

    steps:
      - name: Boot iOS Simulator
        run: |
          DEVICE_NAME="${{ inputs.device }}"
          echo "Booting $DEVICE_NAME..."
          
          # Boot the simulator
          xcrun simctl boot "$DEVICE_NAME"
          
          # Wait until the simulator has completely booted
          xcrun simctl bootstatus "$DEVICE_NAME" -b

      - name: Navigate to Home Screen & Capture Screenshot
        run: |
          # Ensure the simulator is on the SpringBoard (Home Screen)
          xcrun simctl ui booted appearance light
          sleep 3
          
          # Capture the screenshot of the booted simulator
          xcrun simctl io booted screenshot ios-homescreen.png

      - name: Upload Home Screen Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-homescreen-screenshot
          path: ios-homescreen.png
          retention-days: 7
          
