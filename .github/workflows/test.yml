name: Build and Package Android Docs Offline

on:
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and Extract Android & Kotlin Docsets
        run: |
          mkdir -p build-docs
          cd build-docs

          # 1. Download official Android & Kotlin docset archives
          echo "Downloading Android Docset..."
          curl -L -o Android.tgz "https://sanfrancisco.kapeli.com/feeds/Android.tgz"
          tar -xzf Android.tgz

          echo "Downloading Kotlin Docset..."
          curl -L -o Kotlin.tgz "https://sanfrancisco.kapeli.com/feeds/Kotlin.tgz"
          tar -xzf Kotlin.tgz

      - name: Build Search Index and Web Dashboard
        run: |
          cd build-docs
          mkdir -p ../android-docs-offline
          
          # Move full static HTML documentation
          cp -r Android.docset/Contents/Resources/Documents/* ../android-docs-offline/
          mkdir -p ../android-docs-offline/kotlin
          cp -r Kotlin.docset/Contents/Resources/Documents/* ../android-docs-offline/kotlin/

          # Export SQLite index into searchable JSON and build search UI
          python3 - << 'EOF'
          import sqlite3
          import json
          import os

          conn = sqlite3.connect('Android.docset/Contents/Resources/docSet.dsidx')
          cursor = conn.cursor()

          # Query all classes, interfaces, methods, and packages
          cursor.execute("SELECT name, type, path FROM searchIndex WHERE type IN ('Class', 'Interface', 'Package', 'Component', 'Method')")
          rows = cursor.fetchall()

          index_data = [{"name": r[0], "type": r[1], "path": r[2]} for r in rows]

          with open('../android-docs-offline/search-index.json', 'w') as f:
              json.dump(index_data, f)

          print(f"Indexed {len(index_data)} Android API symbols.")

          # Generate modern responsive search shell
          html_content = """<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Android Offline Docs</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #0f172a; color: #f8fafc; }
              #sidebar { width: 340px; border-right: 1px solid #334155; display: flex; flex-direction: column; background: #1e293b; }
              #search-box { padding: 12px; border-bottom: 1px solid #334155; }
              #search { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
              #search:focus { border-color: #3b82f6; }
              #results { flex: 1; overflow-y: auto; list-style: none; }
              .item { padding: 10px 14px; border-bottom: 1px solid #334155; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
              .item:hover { background: #334155; }
              .name { font-size: 14px; font-weight: 500; color: #e2e8f0; }
              .type { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #0f172a; color: #94a3b8; font-weight: 600; }
              #main { flex: 1; display: flex; flex-direction: column; }
              iframe { flex: 1; border: none; background: #ffffff; width: 100%; height: 100%; }
              @media(max-width: 768px) {
                body { flex-direction: column; }
                #sidebar { width: 100%; height: 40vh; }
                #main { height: 60vh; }
              }
            </style>
          </head>
          <body>
            <div id="sidebar">
              <div id="search-box">
                <input type="text" id="search" placeholder="Search Android classes (e.g. Activity, View)..." autofocus>
              </div>
              <ul id="results"></ul>
            </div>
            <div id="main">
              <iframe id="viewer" src="reference/packages.html"></iframe>
            </div>

            <script>
              let data = [];
              const searchInput = document.getElementById('search');
              const resultsList = document.getElementById('results');
              const viewer = document.getElementById('viewer');

              fetch('search-index.json')
                .then(r => r.json())
                .then(json => {
                  data = json;
                  render(data.slice(0, 100));
                });

              function render(items) {
                resultsList.innerHTML = items.map(it => `
                  <li class="item" onclick="loadDoc('${it.path}')">
                    <span class="name">${it.name}</span>
                    <span class="type">${it.type}</span>
                  </li>
                `).join('');
              }

              searchInput.addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase().trim();
                if (!q) return render(data.slice(0, 100));
                const filtered = data.filter(d => d.name.toLowerCase().includes(q)).slice(0, 80);
                render(filtered);
              });

              function loadDoc(path) {
                viewer.src = path;
              }
            </script>
          </body>
          </html>"""

          with open('../android-docs-offline/index.html', 'w') as f:
              f.write(html_content)
          EOF

      - name: Compress Static Output
        run: |
          tar -czf android-docs-offline.tar.gz -C android-docs-offline .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-docs-offline
          path: android-docs-offline.tar.gz
          retention-days: 7
          
