name: Build and Package Android Docs Offline

on:
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Clone DevDocs and Setup Dependencies
        run: |
          git clone --depth 1 https://github.com/freeCodeCamp/devdocs.git devdocs
          cd devdocs
          
          # Remove Ruby and Bundler version locks
          sed -i '/^ruby /d' Gemfile
          sed -i '/BUNDLED WITH/,$d' Gemfile.lock || true
          
          gem install bundler
          bundle install

      - name: Download Android & Kotlin Documentation Sets
        working-directory: devdocs
        env:
          RACK_ENV: production
        run: |
          # Download Android platform API, AndroidX, and Kotlin doc packages
          bundle exec thor docs:download android
          bundle exec thor docs:download kotlin

      - name: Compile and Export Full Static Offline Site
        working-directory: devdocs
        env:
          RACK_ENV: production
        run: |
          # 1. Compile production assets (generates fingerprinted CSS/JS in public/assets)
          bundle exec thor assets:compile

          # 2. Start rackup in PRODUCTION mode
          bundle exec rackup -E production -o 127.0.0.1 -p 9292 &
          SERVER_PID=$!

          # 3. Wait for the server to become active
          for i in {1..30}; do
            if curl -s http://127.0.0.1:9292 > /dev/null; then
              echo "Production server ready on port 9292"
              break
            fi
            sleep 1
          done

          # 4. Prepare distribution directory
          mkdir -p ../android-docs-offline
          mkdir -p ../android-docs-offline/docs

          # 5. Export production HTML shell and manifests
          curl -s http://127.0.0.1:9292/ > ../android-docs-offline/index.html
          curl -s http://127.0.0.1:9292/manifest.json > ../android-docs-offline/manifest.json 2>/dev/null || true
          curl -s http://127.0.0.1:9292/docs/docs.json > ../android-docs-offline/docs/docs.json

          # 6. Copy all compiled static assets (CSS, JS, fonts, icons)
          cp -r public/* ../android-docs-offline/
          
          # 7. Copy all downloaded documentation databases
          cp -r assets/docs/* ../android-docs-offline/docs/ 2>/dev/null || true

          # Clean up background process
          kill $SERVER_PID

      - name: Compress Static Package
        run: |
          tar -czf android-docs-offline.tar.gz -C android-docs-offline .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-docs-offline
          path: android-docs-offline.tar.gz
          retention-days: 7
          
