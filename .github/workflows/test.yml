name: Build and Package Android Docs Offline

on:
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download, Extract, and Index Android & Kotlin Docs
        run: |
          mkdir -p build-docs
          mkdir -p android-docs-offline
          cd build-docs

          python3 - << 'EOF'
          import subprocess
          import sqlite3
          import json
          import os
          import shutil
          import urllib.request

          REGIONS = ["sanfrancisco", "frankfurt", "tokyo", "london", "newyork"]

          def download_docset(name):
              archive = f"{name}.tgz"
              print(f"\n==========================================")
              print(f"  Downloading {name} Documentation...")
              print(f"==========================================")

              urls = []
              
              # 1. Fetch live mirror list from Zeal API
              try:
                  req = urllib.request.Request("https://api.zealdocs.org/v1/docsets", headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      for item in data:
                          if item.get("name", "").lower() == name.lower():
                              if "versions" in item and item["versions"]:
                                  # Add latest version URLs
                                  v = item["versions"][0]
                                  if "url" in v: urls.append(v["url"])
                              if "source" in item and "url" in item["source"]:
                                  urls.append(item["source"]["url"])
              except Exception as e:
                  print(f"Zeal API query failed ({e}), using direct CDN fallbacks...")

              # 2. Add verified direct Kapeli CDN mirror URLs (with /official/ path)
              for r in REGIONS:
                  urls.append(f"http://{r}.kapeli.com/feeds/zzz/official/{name}/{name}.tgz")
                  urls.append(f"https://{r}.kapeli.com/feeds/zzz/official/{name}/{name}.tgz")

              # 3. Download from first working mirror
              downloaded = False
              for url in urls:
                  print(f"Attempting: {url}")
                  res = subprocess.run([
                      "curl", "-f", "-L", "-A", "Mozilla/5.0",
                      "--connect-timeout", "15",
                      "--retry", "2",
                      "-o", archive,
                      url
                  ])

                  if res.returncode == 0 and os.path.exists(archive) and os.path.getsize(archive) > 5000000:
                      mb = os.path.getsize(archive) // (1024 * 1024)
                      print(f"-> SUCCESS: Downloaded {name} ({mb} MB). Extracting...")
                      subprocess.run(["tar", "-xzf", archive], check=True)
                      downloaded = True
                      break
                  else:
                      print("-> Failed, trying next mirror...")

              if not downloaded:
                  raise SystemExit(f"Fatal: Unable to download {name} from any mirror.")

          # Download Android and Kotlin
          download_docset("Android")
          download_docset("Kotlin")

          # Copy documentation files
          print("\nOrganizing static documentation files...")
          out_dir = "../android-docs-offline"

          # 1. Android Documentation Files
          android_doc_dir = "Android.docset/Contents/Resources/Documents"
          for item in os.listdir(android_doc_dir):
              s = os.path.join(android_doc_dir, item)
              d = os.path.join(out_dir, item)
              if os.path.isdir(s):
                  shutil.copytree(s, d, dirs_exist_ok=True)
              else:
                  shutil.copy2(s, d)

          # 2. Kotlin Documentation Files
          kotlin_out = os.path.join(out_dir, "kotlin")
          os.makedirs(kotlin_out, exist_ok=True)
          kotlin_doc_dir = "Kotlin.docset/Contents/Resources/Documents"
          for item in os.listdir(kotlin_doc_dir):
              s = os.path.join(kotlin_doc_dir, item)
              d = os.path.join(kotlin_out, item)
              if os.path.isdir(s):
                  shutil.copytree(s, d, dirs_exist_ok=True)
              else:
                  shutil.copy2(s, d)

          # 3. Build Unified Search Index from SQLite
          print("Building unified search index from SQLite databases...")
          search_entries = []

          # Index Android classes, interfaces, packages, and methods
          android_db = "Android.docset/Contents/Resources/docSet.dsidx"
          if os.path.exists(android_db):
              conn = sqlite3.connect(android_db)
              cur = conn.cursor()
              cur.execute("SELECT name, type, path FROM searchIndex WHERE type IN ('Class', 'Interface', 'Package', 'Method', 'Constructor', 'Component')")
              for r in cur.fetchall():
                  search_entries.append({"n": r[0], "t": f"Android {r[1]}", "p": r[2]})
              conn.close()

          # Index Kotlin functions, classes, and properties
          kotlin_db = "Kotlin.docset/Contents/Resources/docSet.dsidx"
          if os.path.exists(kotlin_db):
              conn = sqlite3.connect(kotlin_db)
              cur = conn.cursor()
              cur.execute("SELECT name, type, path FROM searchIndex WHERE type IN ('Class', 'Interface', 'Package', 'Function', 'Property')")
              for r in cur.fetchall():
                  search_entries.append({"n": r[0], "t": f"Kotlin {r[1]}", "p": f"kotlin/{r[2]}"})
              conn.close()

          with open(os.path.join(out_dir, "search-index.json"), "w") as f:
              json.dump(search_entries, f)

          print(f"Indexed {len(search_entries):,} total API symbols.")

          # 4. Generate Responsive Offline Web App UI
          web_ui = """<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
            <title>Android & Kotlin Offline Docs</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden; }
              #sidebar { width: 360px; border-right: 1px solid #334155; display: flex; flex-direction: column; background: #1e293b; height: 100%; }
              #search-box { padding: 12px; border-bottom: 1px solid #334155; }
              #search { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
              #search:focus { border-color: #3b82f6; }
              #count { font-size: 11px; color: #94a3b8; margin-top: 6px; padding-left: 2px; }
              #results { flex: 1; overflow-y: auto; list-style: none; }
              .item { padding: 10px 14px; border-bottom: 1px solid #334155; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
              .item:hover, .item:active { background: #334155; }
              .name { font-size: 13px; font-weight: 600; color: #e2e8f0; word-break: break-word; }
              .type { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #0f172a; color: #38bdf8; font-weight: 600; margin-left: 8px; white-space: nowrap; }
              #main { flex: 1; display: flex; flex-direction: column; background: #ffffff; }
              iframe { flex: 1; border: none; width: 100%; height: 100%; }
              @media (max-width: 768px) {
                body { flex-direction: column; }
                #sidebar { width: 100%; height: 40vh; }
                #main { height: 60vh; }
              }
            </style>
          </head>
          <body>
            <div id="sidebar">
              <div id="search-box">
                <input type="text" id="search" placeholder="Search (Activity, View, Coroutine)..." autofocus>
                <div id="count">Loading offline symbols...</div>
              </div>
              <ul id="results"></ul>
            </div>
            <div id="main">
              <iframe id="viewer" src="reference/packages.html"></iframe>
            </div>

            <script>
              let data = [];
              const searchInput = document.getElementById('search');
              const resultsList = document.getElementById('results');
              const countEl = document.getElementById('count');
              const viewer = document.getElementById('viewer');

              fetch('search-index.json')
                .then(r => r.json())
                .then(json => {
                  data = json;
                  countEl.innerText = `${data.length.toLocaleString()} symbols ready offline`;
                  render(data.slice(0, 100));
                })
                .catch(() => {
                  countEl.innerText = 'Failed loading search index';
                });

              function render(items) {
                resultsList.innerHTML = items.map(it => `
                  <li class="item" onclick="loadDoc('${it.p}')">
                    <span class="name">${it.n}</span>
                    <span class="type">${it.t}</span>
                  </li>
                `).join('');
              }

              let debounceTimer;
              searchInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                  const q = e.target.value.toLowerCase().trim();
                  if (!q) return render(data.slice(0, 100));
                  const matches = data.filter(d => d.n.toLowerCase().includes(q)).slice(0, 100);
                  render(matches);
                  countEl.innerText = `${matches.length} matches found`;
                }, 60);
              });

              function loadDoc(path) {
                viewer.src = path;
              }
            </script>
          </body>
          </html>"""

          with open(os.path.join(out_dir, "index.html"), "w") as f:
              f.write(web_ui)
          EOF

      - name: Compress Static Output
        run: |
          tar -czf android-docs-offline.tar.gz -C android-docs-offline .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-docs-offline
          path: android-docs-offline.tar.gz
          retention-days: 7
          
