name: build

on:
  workflow_dispatch: 

jobs:
  fedora-test:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # Options include 'temurin', 'zulu', 'corretto', etc.
          java-version: '8'

      - name: running 
        run: | 
            git clone --depth 1 https://github.com/hvdwolf/jExifToolGUI.git
            cd jExifToolGUI
            gradlew build
        
