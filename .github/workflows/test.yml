name: Download Complete Android & Jetpack Docs

on:
  workflow_dispatch:

jobs:
  download-and-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Download and Organize Official Google Documentation
        run: |
          mkdir -p bundle/platform
          mkdir -p bundle/androidx

          echo "=== 1. Downloading Core Android Platform Docs (dl.google.com) ==="
          curl -L -o platform-docs.zip "https://dl.google.com/android/repository/docs-28_r01.zip"
          unzip -q platform-docs.zip
          mv docs/* bundle/platform/
          rm -rf docs platform-docs.zip

          echo "=== 2. Downloading AndroidX & Jetpack Compose Javadocs (Google Maven) ==="
          BASE_MAVEN="https://dl.google.com/android/maven2/androidx"

          declare -A PACKAGES=(
            ["core"]="${BASE_MAVEN}/core/core/1.13.1/core-1.13.1-javadoc.jar"
            ["activity"]="${BASE_MAVEN}/activity/activity/1.9.0/activity-1.9.0-javadoc.jar"
            ["activity-compose"]="${BASE_MAVEN}/activity/activity-compose/1.9.0/activity-compose-1.9.0-javadoc.jar"
            ["lifecycle-runtime"]="${BASE_MAVEN}/lifecycle/lifecycle-runtime/2.8.0/lifecycle-runtime-2.8.0-javadoc.jar"
            ["lifecycle-viewmodel-compose"]="${BASE_MAVEN}/lifecycle/lifecycle-viewmodel-compose/2.8.0/lifecycle-viewmodel-compose-2.8.0-javadoc.jar"
            ["compose-ui"]="${BASE_MAVEN}/compose/ui/ui/1.6.7/ui-1.6.7-javadoc.jar"
            ["compose-foundation"]="${BASE_MAVEN}/compose/foundation/foundation/1.6.7/foundation-1.6.7-javadoc.jar"
            ["compose-material3"]="${BASE_MAVEN}/compose/material3/material3/1.2.1/material3-1.2.1-javadoc.jar"
            ["compose-runtime"]="${BASE_MAVEN}/compose/runtime/runtime/1.6.7/runtime-1.6.7-javadoc.jar"
            ["navigation-compose"]="${BASE_MAVEN}/navigation/navigation-compose/2.7.7/navigation-compose-2.7.7-javadoc.jar"
            ["room-runtime"]="${BASE_MAVEN}/room/room-runtime/2.6.1/room-runtime-2.6.1-javadoc.jar"
            ["work-runtime"]="${BASE_MAVEN}/work/work-runtime/2.9.0/work-runtime-2.9.0-javadoc.jar"
          )

          for name in "${!PACKAGES[@]}"; do
            echo "Fetching $name..."
            mkdir -p "bundle/androidx/$name"
            curl -sL "${PACKAGES[$name]}" -o temp.jar
            unzip -q temp.jar -d "bundle/androidx/$name"
            rm temp.jar
          done

          echo "=== 3. Creating Master Offline Dashboard ==="
          cat << 'EOF' > bundle/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Android & Jetpack Offline Documentation</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
              .container { max-width: 900px; margin: 0 auto; }
              h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; color: #38bdf8; }
              p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
              .section-title { font-size: 18px; font-weight: 700; margin: 24px 0 12px; color: #e2e8f0; border-bottom: 1px solid #334155; padding-bottom: 6px; }
              .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
              .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; text-decoration: none; color: inherit; transition: border-color 0.2s; display: block; }
              .card:hover { border-color: #38bdf8; }
              .card-title { font-weight: 600; font-size: 15px; color: #f1f5f9; margin-bottom: 4px; }
              .card-desc { font-size: 12px; color: #94a3b8; line-height: 1.4; }
              .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: #0284c7; color: #fff; margin-bottom: 6px; }
              .tag-core { background: #16a34a; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Android & Jetpack Offline Docs</h1>
              <p>Official offline documentation hosted locally in Termux.</p>

              <div class="section-title">Core Android OS</div>
              <div class="grid">
                <a class="card" href="platform/reference/packages.html">
                  <span class="tag tag-core">Platform SDK</span>
                  <div class="card-title">Core Android Reference</div>
                  <div class="card-desc">All android.* system packages, Views, Widgets, Services, Permissions, and Hardware APIs.</div>
                </a>
              </div>

              <div class="section-title">Jetpack Compose</div>
              <div class="grid">
                <a class="card" href="androidx/compose-ui/index.html">
                  <span class="tag">Compose</span>
                  <div class="card-title">Compose UI</div>
                  <div class="card-desc">Layout primitives, Modifiers, Text, Graphics, and Gestures.</div>
                </a>
                <a class="card" href="androidx/compose-foundation/index.html">
                  <span class="tag">Compose</span>
                  <div class="card-title">Compose Foundation</div>
                  <div class="card-desc">LazyColumn, LazyRow, Scrollables, and Shape foundations.</div>
                </a>
                <a class="card" href="androidx/compose-material3/index.html">
                  <span class="tag">Compose</span>
                  <div class="card-title">Material 3</div>
                  <div class="card-desc">Buttons, Cards, Dialogs, TopAppBar, and Color Schemes.</div>
                </a>
                <a class="card" href="androidx/activity-compose/index.html">
                  <span class="tag">Compose</span>
                  <div class="card-title">Activity Compose</div>
                  <div class="card-desc">ComponentActivity, setContent, BackHandler, and State flows.</div>
                </a>
                <a class="card" href="androidx/navigation-compose/index.html">
                  <span class="tag">Compose</span>
                  <div class="card-title">Navigation Compose</div>
                  <div class="card-desc">NavHost, NavController, and Compose destinations.</div>
                </a>
              </div>

              <div class="section-title">AndroidX Libraries</div>
              <div class="grid">
                <a class="card" href="androidx/core/index.html">
                  <span class="tag">AndroidX</span>
                  <div class="card-title">AndroidX Core</div>
                  <div class="card-desc">CoreCompat, NotificationCompat, and ContextCompat.</div>
                </a>
                <a class="card" href="androidx/lifecycle-runtime/index.html">
                  <span class="tag">AndroidX</span>
                  <div class="card-title">Lifecycle</div>
                  <div class="card-desc">LifecycleOwner, ViewModel, and LiveData/StateFlow.</div>
                </a>
                <a class="card" href="androidx/room-runtime/index.html">
                  <span class="tag">AndroidX</span>
                  <div class="card-title">Room Database</div>
                  <div class="card-desc">RoomDatabase, DAOs, Entities, and SQLite ORM.</div>
                </a>
                <a class="card" href="androidx/work-runtime/index.html">
                  <span class="tag">AndroidX</span>
                  <div class="card-title">WorkManager</div>
                  <div class="card-desc">CoroutineWorker, PeriodicWorkRequest, and Background Jobs.</div>
                </a>
              </div>
            </div>
          </body>
          </html>
          EOF

          echo "=== 4. Packaging Archive ==="
          tar -czf android-full-offline-docs.tar.gz -C bundle .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-full-offline-docs
          path: android-full-offline-docs.tar.gz
          retention-days: 7
          
