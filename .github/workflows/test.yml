name: Build and Package Android Docs Offline

on:
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Clone DevDocs and Install Dependencies
        run: |
          git clone --depth 1 https://github.com/freeCodeCamp/devdocs.git devdocs
          cd devdocs
          
          # Remove Ruby and Bundler version locks for clean installation
          sed -i '/^ruby /d' Gemfile
          sed -i '/BUNDLED WITH/,$d' Gemfile.lock || true
          
          gem install bundler
          bundle install

      - name: Download Android & Kotlin Docsets
        working-directory: devdocs
        run: |
          # Downloads full platform APIs, AndroidX/Jetpack classes, and Kotlin language reference
          bundle exec thor docs:download android
          bundle exec thor docs:download kotlin

      - name: Compile and Export Static Offline Site
        working-directory: devdocs
        run: |
          # 1. Compile CSS/JS assets
          bundle exec thor assets:compile
          
          # 2. Start lightweight local server in background to generate offline shell
          bundle exec rackup -o 127.0.0.1 -p 9292 &
          SERVER_PID=$!
          
          # Wait until local server is ready
          for i in {1..30}; do
            if curl -s http://127.0.0.1:9292 > /dev/null; then
              echo "Server ready on port 9292"
              break
            fi
            sleep 1
          done

          # 3. Create standalone static folder
          mkdir -p ../android-docs-offline
          cp -r public/* ../android-docs-offline/
          
          # 4. Dump the generated app shell and manifest
          curl -s http://127.0.0.1:9292 > ../android-docs-offline/index.html
          curl -s http://127.0.0.1:9292/manifest.json > ../android-docs-offline/manifest.json 2>/dev/null || true
          
          # 5. Export docs manifest and documentation databases
          mkdir -p ../android-docs-offline/docs
          curl -s http://127.0.0.1:9292/docs/docs.json > ../android-docs-offline/docs/docs.json
          cp -r assets/docs/* ../android-docs-offline/docs/ 2>/dev/null || true
          
          # Kill background server
          kill $SERVER_PID

      - name: Compress Static Output
        run: |
          tar -czf android-docs-offline.tar.gz -C android-docs-offline .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-docs-offline
          path: android-docs-offline.tar.gz
          retention-days: 7
          
