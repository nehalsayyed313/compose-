name: Build Webstudio Native ARM64 (Termux PRoot)

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        default: '20'

jobs:
  build:
    name: Native ARM64 Build
    runs-on: ubuntu-24.04-arm

    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable pnpm 9 via Corepack
        run: |
          corepack enable
          # Pin to pnpm 9 to match Webstudio workspace lockfile schema
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Inspect workspace scripts
        run: |
          echo "=== Root package.json scripts ==="
          node -e 'const pkg = require("./package.json"); console.log(pkg.scripts || "None");'
          if [ -f "apps/builder/package.json" ]; then
            echo "=== apps/builder scripts ==="
            node -e 'const pkg = require("./apps/builder/package.json"); console.log(pkg.scripts || "None");'
          fi

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          
          # Assert node_modules exists
          if [ ! -d "node_modules" ]; then
            echo "ERROR: node_modules was not created!"
            exit 1
          fi

      - name: Build monorepo packages & builder app
        run: |
          echo "[*] Step 1: Building workspace packages in topological order..."
          pnpm run -r --if-present build

          echo "[*] Step 2: Building builder app..."
          if [ -d "apps/builder" ]; then
            pnpm --filter @webstudio-is/builder run build || pnpm --filter builder run build || (cd apps/builder && pnpm run build)
          fi

      - name: Create launch script & package bundle
        run: |
          cat << 'EOF' > start.sh
          #!/usr/bin/env bash
          set -e

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" >/dev/null 2>&1 && pwd)"
          cd "$SCRIPT_DIR"

          echo "[*] Launching Webstudio (ARM64 Native)..."

          if ! command -v node >/dev/null 2>&1; then
            echo "[!] Node.js not found in PRoot. Run: apt update && apt install -y nodejs npm"
            exit 1
          fi

          export NODE_ENV=production
          export HOST=${HOST:-0.0.0.0}
          export PORT=${PORT:-3000}

          corepack enable 2>/dev/null || true

          if [ -d "apps/builder" ]; then
            cd apps/builder
            if command -v pnpm >/dev/null 2>&1; then
              pnpm start || pnpm run start
            else
              npm start
            fi
          elif node -e 'const pkg = require("./package.json"); process.exit(pkg.scripts && pkg.scripts.start ? 0 : 1)' 2>/dev/null; then
            pnpm start
          else
            pnpm run -r --if-present start
          fi
          EOF

          chmod +x start.sh

          echo "[*] Packaging archive..."
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='docs' \
              --exclude='fixtures' \
              --exclude='*.tsbuildinfo' \
              --warning=no-file-changed \
              -czf /tmp/webstudio-arm64.tar.gz .

          mv /tmp/webstudio-arm64.tar.gz ./webstudio-arm64.tar.gz

          echo "=== Bundle Size ==="
          ls -lh webstudio-arm64.tar.gz

      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webstudio-termux-ubuntu-arm64
          path: webstudio-arm64.tar.gz
          retention-days: 7
          
