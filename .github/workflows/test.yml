name: Build and Package Android Docs Offline

on:
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone DevDocs and Fix Version Constraints
        run: |
          git clone --depth 1 https://github.com/freeCodeCamp/devdocs.git devdocs
          cd devdocs
          
          # Remove strict Ruby version check and Bundler version locks
          sed -i '/^ruby /d' Gemfile
          sed -i '/BUNDLED WITH/,$d' Gemfile.lock || true
          
          # Install gems and npm packages
          gem install bundler
          bundle install
          npm install

      - name: Download Android & Kotlin Docsets
        working-directory: devdocs
        run: |
          # Downloads full platform classes, AndroidX/Jetpack APIs, and Kotlin reference
          bundle exec thor docs:download android
          bundle exec thor docs:download kotlin

      - name: Compile and Package Static Files
        working-directory: devdocs
        run: |
          # 1. Compile web assets into static bundle
          bundle exec thor assets:compile
          
          # 2. Assemble the standalone offline distribution directory
          mkdir -p ../android-docs-offline
          cp -r public/* ../android-docs-offline/
          
          # 3. Copy downloaded docsets and database into the static bundle
          mkdir -p ../android-docs-offline/docs
          cp -r assets/docs/android* ../android-docs-offline/docs/ 2>/dev/null || true
          cp -r assets/docs/kotlin* ../android-docs-offline/docs/ 2>/dev/null || true

      - name: Compress Archive
        run: |
          tar -czf android-docs-offline.tar.gz -C android-docs-offline .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-docs-offline
          path: android-docs-offline.tar.gz
          retention-days: 7
          
