name: iOS Simulator Home Screen Screenshot

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Preferred iOS Simulator (optional - auto-detects if not found)'
        required: false
        default: 'iPhone'
        type: string

jobs:
  capture-homescreen:
    name: Capture iOS Home Screen
    runs-on: macos-latest

    steps:
      - name: Find & Boot Available iOS Simulator
        run: |
          PREFERRED="${{ inputs.device }}"
          
          # Find the UDID of an available iPhone matching the input, or grab the first available iPhone
          UDID=$(xcrun simctl list devices available | grep -i "$PREFERRED" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          
          if [ -z "$UDID" ]; then
            echo "Preferred device '$PREFERRED' not found. Selecting first available iPhone..."
            UDID=$(xcrun simctl list devices available | grep "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          fi

          if [ -z "$UDID" ]; then
            echo "Error: No available iOS simulators found on this runner."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Booting simulator UDID: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Capture Home Screen Screenshot
        run: |
          # Ensure SpringBoard UI is settled
          xcrun simctl ui booted appearance light
          sleep 3
          
          # Capture the screenshot
          xcrun simctl io booted screenshot ios-homescreen.png

      - name: Upload Home Screen Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-homescreen-screenshot
          path: ios-homescreen.png
          retention-days: 7
          
