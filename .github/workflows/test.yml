name: Ollama MoE Model Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "16GB-safe MoE model tag to pull and test"
        required: false
        default: "deepseek-coder-v2:16b"
        type: choice
        options:
          - deepseek-coder-v2:16b
          - granite3-moe:3b
          - granite3-moe:1b
      prompt:
        description: "Test prompt"
        required: false
        default: "Explain how DNS resolution works in 3 short sentences."
        type: string

jobs:
  test-ollama-moe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama server is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Ollama server failed to start."
          cat /tmp/ollama.log
          exit 1

      - name: Pull MoE model
        run: |
          START=$(date +%s)
          ollama pull "${{ inputs.model }}"
          END=$(date +%s)
          echo "Download time: $((END - START))s"

      - name: Run MoE inference test
        run: |
          RESPONSE=$(curl -sf http://localhost:11434/api/generate \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg model "${{ inputs.model }}" \
              --arg prompt "${{ inputs.prompt }}" \
              '{model: $model, prompt: $prompt, stream: false}')")

          OUTPUT=$(echo "$RESPONSE" | jq -r '.response')

          if [ -z "$OUTPUT" ] || [ "$OUTPUT" = "null" ]; then
            echo "Error: Empty response from model."
            exit 1
          fi

          METRICS=$(echo "$RESPONSE" | jq -r '
            "- **Model load:** \((.load_duration / 1e9 * 100 | round) / 100)s\n" +
            "- **Prompt tokens:** \(.prompt_eval_count) (\((.prompt_eval_count / (.prompt_eval_duration / 1e9)) | round) tok/s)\n" +
            "- **Generated tokens:** \(.eval_count) (\((.eval_count / (.eval_duration / 1e9)) | round) tok/s)\n" +
            "- **Total time:** \((.total_duration / 1e9 * 100 | round) / 100)s"
          ')

          printf "=== Model Response ===\n%s\n\n=== Metrics ===\n%s\n" "$OUTPUT" "$METRICS"

          {
            echo "### Ollama MoE Inference Result (\`${{ inputs.model }}\`)"
            echo "**Prompt:** ${{ inputs.prompt }}"
            echo ""
            echo "$OUTPUT"
            echo ""
            echo "#### Performance"
            echo "$METRICS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump server logs on failure
        if: failure()
        run: cat /tmp/ollama.log
        
