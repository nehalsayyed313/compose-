name: Build Webstudio Native ARM64 (Termux PRoot)

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        default: '20'

jobs:
  build:
    name: Native ARM64 Build
    runs-on: ubuntu-24.04-arm

    # Declare NODE_OPTIONS here to bypass $GITHUB_ENV runner security restrictions
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Run repo setup scripts (if present)
        run: |
          if [ -f "./submodules.sh" ]; then
            bash ./submodules.sh || true
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo packages
        run: |
          # Use --if-present so packages lacking a build script do not fail the build
          if node -e 'const pkg = require("./package.json"); process.exit(pkg.scripts && pkg.scripts.build ? 0 : 1)'; then
            echo "[*] Running root build script..."
            pnpm run build
          else
            echo "[*] Building all workspace packages with --if-present..."
            pnpm -r --if-present run build
          fi

      - name: Create launch script & package bundle
        run: |
          cat << 'EOF' > start.sh
          #!/usr/bin/env bash
          set -e

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" >/dev/null 2>&1 && pwd)"
          cd "$SCRIPT_DIR"

          echo "[*] Launching Webstudio (ARM64 Native)..."

          if ! command -v node >/dev/null 2>&1; then
            echo "[!] Node.js not found in PRoot. Run: apt update && apt install -y nodejs npm"
            exit 1
          fi

          export NODE_ENV=production
          export HOST=${HOST:-0.0.0.0}
          export PORT=${PORT:-3000}

          corepack enable 2>/dev/null || true

          # Start via root if available, otherwise launch apps/builder
          if node -e 'const pkg = require("./package.json"); process.exit(pkg.scripts && pkg.scripts.start ? 0 : 1)' 2>/dev/null; then
            pnpm start
          elif [ -d "apps/builder" ]; then
            pnpm --filter @webstudio-is/builder start || pnpm --filter builder start
          else
            pnpm -r --if-present run start
          fi
          EOF

          chmod +x start.sh

          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='docs' \
              --exclude='fixtures' \
              --exclude='*.tsbuildinfo' \
              -czf webstudio-arm64.tar.gz .

      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webstudio-termux-ubuntu-arm64
          path: webstudio-arm64.tar.gz
          retention-days: 7
          
