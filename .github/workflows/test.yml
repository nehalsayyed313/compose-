name: Build Webstudio Native ARM64 (Termux PRoot)

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        default: '20'

jobs:
  build:
    name: Native ARM64 Build
    runs-on: ubuntu-24.04-arm

    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Webstudio source code is present
        run: |
          if [ ! -f "package.json" ]; then
            echo "[*] package.json not found in repository. Fetching Webstudio source..."
            git clone --depth 1 --recurse-submodules https://github.com/webstudio-is/webstudio.git /tmp/webstudio-src
            shopt -s dotglob
            cp -rf /tmp/webstudio-src/* .
            rm -rf /tmp/webstudio-src
          fi

          echo "[*] Source verified. Current directory contents:"
          ls -la

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Run submodules setup (if present)
        run: |
          if [ -f "./submodules.sh" ]; then
            bash ./submodules.sh || true
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Webstudio
        run: |
          echo "[*] Building Webstudio packages..."
          pnpm run build

      - name: Create launch script & package archive
        run: |
          cat << 'EOF' > start.sh
          #!/usr/bin/env bash
          set -e

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" >/dev/null 2>&1 && pwd)"
          cd "$SCRIPT_DIR"

          echo "[*] Launching Webstudio (ARM64 Native)..."

          if ! command -v node >/dev/null 2>&1; then
            echo "[!] Node.js not found in PRoot. Run: apt update && apt install -y nodejs npm"
            exit 1
          fi

          export NODE_ENV=production
          export HOST=${HOST:-0.0.0.0}
          export PORT=${PORT:-3000}
          export DATABASE_URL=${DATABASE_URL:-file:./dev.db}

          corepack enable 2>/dev/null || true

          if command -v pnpm >/dev/null 2>&1; then
            pnpm start || pnpm run start
          elif [ -d "apps/builder" ]; then
            cd apps/builder && npm start
          else
            npm start
          fi
          EOF

          chmod +x start.sh

          echo "[*] Creating production archive..."
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='docs' \
              --exclude='fixtures' \
              --exclude='*.tsbuildinfo' \
              --warning=no-file-changed \
              -czf /tmp/webstudio-arm64.tar.gz .

          mv /tmp/webstudio-arm64.tar.gz ./webstudio-arm64.tar.gz

          echo "=== Archive Ready ==="
          ls -lh webstudio-arm64.tar.gz

      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webstudio-termux-ubuntu-arm64
          path: webstudio-arm64.tar.gz
          retention-days: 7
          
