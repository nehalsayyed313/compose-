name: Build

on: workflow_dispatch

jobs:
  build:
     runs-on: ubuntu-latest
     steps:
       - name: Set up 
         uses: actions/setup-python@v5
         with:
            python-version: '3.11'
           
       - name: running
         run: |
             git clone --depth 1 https://github.com/openai/openai-python.git
             cd openai-python
             pip install .
