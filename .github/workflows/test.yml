name: Build Webstudio Native ARM64 (Termux PRoot)

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        default: '20'

jobs:
  build:
    name: Native ARM64 Build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Increase Node build memory
        run: |
          echo "NODE_OPTIONS=--max-old-space-size=6144" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma clients & Build
        run: |
          pnpm exec prisma generate || true
          pnpm build

      - name: Create launch script & bundle archive
        run: |
          cat << 'EOF' > start.sh
          #!/usr/bin/env bash
          set -e

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" >/dev/null 2>&1 && pwd)"
          cd "$SCRIPT_DIR"

          echo "[*] Launching Webstudio (ARM64 Native)..."

          if ! command -v node >/dev/null 2>&1; then
            echo "[!] Node.js not found in PRoot. Install with: apt update && apt install -y nodejs"
            exit 1
          fi

          export NODE_ENV=production
          export HOST=${HOST:-0.0.0.0}
          export PORT=${PORT:-3000}
          export DATABASE_URL=${DATABASE_URL:-file:./dev.db}

          corepack enable 2>/dev/null || true

          if command -v pnpm >/dev/null 2>&1; then
            pnpm start
          else
            npm run start
          fi
          EOF

          chmod +x start.sh

          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='docs' \
              --exclude='fixtures' \
              --exclude='*.tsbuildinfo' \
              -czf webstudio-arm64.tar.gz .

      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webstudio-termux-ubuntu-arm64
          path: webstudio-arm64.tar.gz
          retention-days: 7
          
