name: Build Skia ARM64

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Skia
        uses: actions/checkout@v4
        with:
          repository: google/skia
          path: skia
          submodules: recursive
          fetch-depth: 1

      - name: Install Cross-Toolchains and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            pkg-config-aarch64-linux-gnu \
            python3 \
            libfontconfig1-dev \
            curl

      - name: Install Bazelisk (Direct Binary)
        run: |
          sudo curl -fSsL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Configure and Build Skia
        working-directory: skia
        run: |
          # Define linux_arm64 config preset
          cat << 'EOF' > user.bazelrc
          build:linux_arm64 --cpu=aarch64
          build:linux_arm64 --platforms=//bazel/platform:linux_arm64
          build:linux_arm64 --compilation_mode=opt
          EOF

          # Run build
          bazel build //:skia_public --config=linux_arm64

      - name: Upload Skia Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skia-linux-arm64
          path: skia/bazel-bin/libskia_public.a
          if-no-files-found: warn
          
