name: Build and Package Expo Docs

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Branch or tag to clone from expo/expo'
        required: true
        default: 'main'
        type: string

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: 'expo/expo'
          ref: ${{ inputs.sdk_version }}
          sparse-checkout: |
            docs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile=false --ignore-scripts

      - name: Patch and Build Docs
        working-directory: docs
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_IGNORE_TYPESCRIPT_BUILD_ERRORS: "1"
          NEXT_IGNORE_ESLINT_BUILD_ERRORS: "1"
        run: |
          # 1. Patch the parameter implicit any in code-utilities.ts
          if [ -f "common/code-utilities.ts" ]; then
            sed -i 's/sdkVersionValues\.find(s =>/sdkVersionValues.find((s: any) =>/g' common/code-utilities.ts
          fi

          # 2. Patch next.config.js safely (check existence first)
          if [ -f "next.config.js" ]; then
            node -e "
              const fs = require('fs');
              let src = fs.readFileSync('next.config.js', 'utf8');
              if (!src.includes('ignoreBuildErrors')) {
                src = src.replace(/module\.exports\s*=\s*{/, 'module.exports = {\n  typescript: { ignoreBuildErrors: true },\n  eslint: { ignoreDuringBuilds: true },');
                fs.writeFileSync('next.config.js', src);
              }
            "
          fi

          # 3. Export static HTML files
          pnpm export

      - name: Compress Static Output
        working-directory: docs
        run: |
          tar -czf expo-docs-offline.tar.gz -C out .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-docs-offline
          path: docs/expo-docs-offline.tar.gz
          retention-days: 7
          
